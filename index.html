<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة احجزلي - البوابة الرئيسية</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1a3c6d 0%, #2b5c9e 50%, #0d2342 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(circle at 15% 20%, rgba(241,196,15,0.12) 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(241,196,15,0.10) 0%, transparent 45%);
        pointer-events: none;
    }

    /* ===== الهيدر ===== */
    .gate-header {
        text-align: center;
        margin-bottom: 45px;
        position: relative;
        z-index: 2;
        padding: 35px 40px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow:
            0 8px 0 rgba(0,0,0,0.15),
            0 18px 40px rgba(0,0,0,0.28);
        max-width: 850px;
        width: 100%;
        animation: fadeDown 0.7s ease;
        overflow: hidden;
    }

    .gate-header h1 {
        position: relative;
        z-index: 2;
        font-size: 48px;
        font-weight: 900;
        color: #1a3c6d;
        letter-spacing: 2px;
        margin-bottom: 10px;
        text-shadow:
            0 2px 0 #e0e7f1,
            0 4px 10px rgba(43,92,158,0.25);
    }

    .gate-header p {
        position: relative;
        z-index: 2;
        font-size: 17px;
        color: #2b5c9e;
        font-weight: 700;
        text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    .gate-header .divider-line {
        position: relative;
        z-index: 2;
        width: 120px;
        height: 4px;
        background: linear-gradient(90deg, transparent, #f1c40f, transparent);
        margin: 18px auto 0;
        border-radius: 4px;
    }

    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-25px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== شبكة البوابات ===== */
    .gates-wrapper {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
        width: 100%;
        max-width: 850px;
        position: relative;
        z-index: 2;
    }

    /* ===== كارت البوابة ===== */
    .gate-card {
        border-radius: 24px;
        padding: 50px 30px 40px;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        border: 3px solid transparent;
        box-shadow: 0 10px 0 rgba(0,0,0,0.18), 0 18px 40px rgba(0,0,0,0.28);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.7s ease backwards;
        min-height: 420px;

        /* صورة الكارت كاملة - للمعلم */
        background-image:
            linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.95) 100%),
            url('teacher.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #f4f7fb;
    }

    .gate-card:nth-child(1) { animation-delay: 0.15s; }
    .gate-card:nth-child(2) { animation-delay: 0.3s; }

    /* صورة الكارت كاملة - للطالب */
    .gate-card.student-card {
        background-image:
            linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.95) 100%),
            url('student.png');
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(35px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* شريط علوي ملوّن */
    .gate-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 8px;
        background: linear-gradient(90deg, #2b5c9e, #f1c40f);
        transition: height 0.3s ease;
        z-index: 5;
    }

    .gate-card.student-card::before {
        background: linear-gradient(90deg, #28a745, #f1c40f);
    }

    .gate-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 16px 0 rgba(0,0,0,0.18), 0 28px 55px rgba(0,0,0,0.38);
    }

    .gate-card:hover::before { height: 12px; }

    .gate-card:active { transform: translateY(-2px) scale(0.99); }

    /* رفع المحتوى فوق الصورة */
    .gate-card > * {
        position: relative;
        z-index: 2;
    }

    /* ===== النصوص ===== */
    .gate-title {
        font-size: 28px;
        font-weight: 900;
        color: #1a3c6d;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 4px rgba(255,255,255,0.8);
    }

    .gate-desc {
        font-size: 14px;
        color: #334155;
        font-weight: 600;
        line-height: 1.7;
        max-width: 280px;
    }

    /* ===== زر الدخول ===== */
    .gate-btn {
        margin-top: 8px;
        padding: 13px 38px;
        border-radius: 50px;
        font-size: 15px;
        font-weight: 900;
        color: white;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.25s ease;
        border: none;
    }

    .teacher-card .gate-btn {
        background: linear-gradient(180deg, #2b5c9e 0%, #1a3c6d 100%);
        box-shadow: 0 5px 0 #0d2342, 0 8px 18px rgba(43,92,158,0.35);
    }

    .student-card .gate-btn {
        background: linear-gradient(180deg, #2ecc71 0%, #1e7e34 100%);
        box-shadow: 0 5px 0 #155724, 0 8px 18px rgba(40,167,69,0.35);
    }

    .gate-card:hover .gate-btn { transform: translateY(-2px); }

    /* ===== الفوتر ===== */
    .gate-footer {
        margin-top: 50px;
        text-align: center;
        color: #94a3b8;
        font-size: 13px;
        font-weight: 600;
        position: relative;
        z-index: 2;
        animation: fadeUp 0.7s ease 0.45s backwards;
    }

    .gate-footer .brand { color: #f1c40f; font-weight: 900; }

    /* ===== استجابة الشاشات ===== */
    @media (max-width: 700px) {
        .gate-header { padding: 25px 20px; }
        .gate-header h1 { font-size: 32px; }
        .gate-header p { font-size: 14px; }
        .gates-wrapper {
            grid-template-columns: 1fr;
            gap: 22px;
            max-width: 420px;
        }
        .gate-card { padding: 40px 22px 32px; min-height: 360px; }
        .gate-title { font-size: 24px; }
        .gate-desc { font-size: 13px; }
        .gate-footer { margin-top: 35px; }
    }

    @media (max-width: 360px) {
        .gate-header h1 { font-size: 26px; }
        .gate-btn { padding: 11px 28px; font-size: 14px; }
    }
</style>
</head>
<body>

    <header class="gate-header">
        <h1>منصة احجزلي</h1>
        <p>بوابتك الأولى لحجز وإدارة الدروس والمجموعات</p>
        <div class="divider-line"></div>
    </header>

    <main class="gates-wrapper">

        <!-- بوابة المعلم -->
        <a href="mester1.html" class="gate-card teacher-card">
            <div class="gate-title">بوابة المعلم</div>
            <div class="gate-desc">
                أنشئ مجموعاتك، حدّد مواعيد الحصص، واختر المواد والصفوف التي تدرّسها بسهولة.
            </div>
            <span class="gate-btn">
                <span>دخول المعلم</span>
                <span>❮</span>
            </span>
        </a>

        <!-- بوابة الطالب -->
        <a href="student.html" class="gate-card student-card">
            <div class="gate-title">بوابة الطالب</div>
            <div class="gate-desc">
                ابحث عن المجموعات المتاحة، احجز مكانك، وتابع مواعيد حصصك مع معلميك.
            </div>
            <span class="gate-btn">
                <span>دخول الطالب</span>
                <span>❮</span>
            </span>
        </a>

    </main>

    <footer class="gate-footer">
        © 2025 <span class="brand">منصة احجزلي</span> — جميع الحقوق محفوظة
    </footer>

    <script>
        document.querySelectorAll('.gate-card').forEach(card => {
            card.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href === 'student.html') {
                    e.preventDefault();
                    alert('🚧 بوابة الطالب قيد التطوير حالياً.\nسيتم إتاحتها قريباً إن شاء الله.');
                }
            });
        });
    </script>

</body>
</html>
