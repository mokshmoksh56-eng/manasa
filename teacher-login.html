<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دخول المعلم - منصة احجزلي</title>

<!-- مكتبات Firebase لقاعدة البيانات -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyABNlQQpyIw3k_ziw_-xT7SUrMV_v8Tt1Y",
        authDomain: "manasa-2e9bd.firebaseapp.com",
        projectId: "manasa-2e9bd",
        storageBucket: "manasa-2e9bd.firebasestorage.app",
        messagingSenderId: "603553286689",
        appId: "1:603553286689:web:dbc6db83d6c1eee1feb160",
        measurementId: "G-VG0KN2RMS0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
</script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { min-height: 100vh; background: linear-gradient(180deg, #e8f0fa 0%, #d4e3f7 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(26, 60, 109, 0.15); max-width: 440px; width: 100%; overflow: hidden; }
    .login-header { background-color: #e8f0fa; background-image: url('teacher.png'); background-position: center top; background-size: contain; background-repeat: no-repeat; min-height: 270px; padding: 40px 25px 30px; display: flex; flex-direction: column; justify-content: flex-end; text-align: center; position: relative; transition: background-image 0.4s ease-in-out; }
    .login-header::before { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(26, 60, 109, 0.85), transparent); z-index: 1; }
    .login-header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #f1c40f 0%, #f39c12 100%); z-index: 3; }
    .login-header h1 { font-size: 26px; font-weight: 900; color: #f1c40f; margin-bottom: 5px; position: relative; z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .login-header p { font-size: 13px; color: #ffffff; font-weight: 700; position: relative; z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .tabs { display: flex; background: #f1f5f9; border-radius: 12px; margin: 20px 25px 0; padding: 5px; gap: 5px; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 900; color: #64748b; background: transparent; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
    .tab.active { background: linear-gradient(180deg, #2b5c9e 0%, #1a3c6d 100%); color: white; box-shadow: 0 4px 12px rgba(43, 92, 158, 0.3); }
    .login-body { padding: 25px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 900; color: #1a3c6d; margin-bottom: 8px; }
    .form-label .required { color: #dc3545; }
    .form-input { width: 100%; padding: 14px 16px; border: 2px solid #e0e4e8; border-radius: 12px; font-size: 16px; font-weight: 700; color: #1a3c6d; background: #fff; transition: all 0.2s ease; font-family: inherit; }
    select.form-input { cursor: pointer; }
    .form-input:focus { border-color: #2b5c9e; outline: none; box-shadow: 0 0 0 4px rgba(43, 92, 158, 0.1); }
    .form-input::placeholder { color: #94a3b8; font-weight: 500; }
    .form-input[dir="ltr"] { text-align: left; }
    .pin-wrapper { position: relative; }
    .pin-input { letter-spacing: 12px; font-size: 22px; text-align: center; font-weight: 900; padding-left: 50px; padding-right: 16px; }
    .pin-toggle { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: #f1f5f9; border: none; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .pin-toggle:hover { background: #e2e8f0; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(180deg, #2b5c9e 0%, #1a3c6d 100%); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #0d2342, 0 8px 15px rgba(0, 0, 0, 0.15); transition: 0.2s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .submit-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #0d2342; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { background: #fef2f2; border: 2px solid #fecaca; color: #991b1b; padding: 12px 15px; border-radius: 10px; font-size: 13px; font-weight: 800; margin-bottom: 15px; display: none; align-items: center; gap: 8px; }
    .error-msg.show { display: flex; }
    .success-msg { background: #f0fdf4; border: 2px solid #bbf7d0; color: #166534; padding: 12px 15px; border-radius: 10px; font-size: 13px; font-weight: 800; margin-bottom: 15px; display: none; align-items: center; gap: 8px; }
    .success-msg.show { display: flex; }
    .form-view { display: none; }
    .form-view.active { display: block; }
    .bottom-links { display: flex; justify-content: space-between; align-items: center; padding: 0 25px 25px; margin-top: 15px; }
    .back-home { color: #64748b; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; }
    .back-home:hover { color: #2b5c9e; }
    .delete-account { background: none; border: none; color: #dc3545; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
    .delete-account:hover { color: #b02a37; }
    .row-group { display: flex; gap: 15px; }
    .row-group .form-group { flex: 1; }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header" id="headerSection">
        <h1>بوابة المعلم</h1>
        <p>منصة احجزلي - دخول المعلمين</p>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">🔐 تسجيل دخول</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">✍ حساب جديد</button>
    </div>

    <div class="login-body">
        <div class="error-msg" id="errorMsg">
            <span>⚠️</span>
            <span id="errorText"></span>
        </div>
        <div class="success-msg" id="successMsg">
            <span>✅</span>
            <span id="successText"></span>
        </div>

        <div class="form-view active" id="loginView">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                    <input type="tel" id="loginPhone" class="form-input" placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" maxlength="11" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'');">
                </div>
                <div class="form-group">
                    <label class="form-label">🔒 الرقم السري (4 أرقام) <span class="required">*</span></label>
                    <div class="pin-wrapper">
                        <input type="password" id="loginPin" class="form-input pin-input" placeholder="••••" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        <button type="button" class="pin-toggle" onclick="togglePin('loginPin', this)">👁</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">
                    <span>🚀</span><span>تسجيل الدخول</span>
                </button>
            </form>
        </div>

        <div class="form-view" id="registerView">
            <form onsubmit="handleRegister(event)">
                <div class="row-group">
                    <div class="form-group">
                        <label class="form-label">🎓 اللقب <span class="required">*</span></label>
                        <select id="regTitle" class="form-input" required onchange="updateHeaderImage(this.value)">
                            <option value="" disabled selected>اختر...</option>
                            <option value="مستر">مستر</option>
                            <option value="مس">مس</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">🎂 العمر <span class="required">*</span></label>
                        <input type="text" id="regAge" class="form-input" placeholder="مثال: 30" inputmode="numeric" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,2)">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">👤 الاسم <span class="required">*</span></label>
                    <input type="text" id="regName" class="form-input" placeholder="مثال: أحمد محمد" required maxlength="50">
                </div>
                <div class="form-group">
                    <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                    <input type="tel" id="regPhone" class="form-input" placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" maxlength="11" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>
                <div class="row-group">
                    <div class="form-group">
                        <label class="form-label">🔒 الرقم السري <span class="required">*</span></label>
                        <div class="pin-wrapper">
                            <input type="password" id="regPin" class="form-input pin-input" placeholder="••••" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required dir="ltr" style="padding-left: 35px; letter-spacing: 5px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">🔒 تأكيد السري <span class="required">*</span></label>
                        <div class="pin-wrapper">
                            <input type="password" id="regPinConfirm" class="form-input pin-input" placeholder="••••" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required dir="ltr" style="padding-left: 35px; letter-spacing: 5px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        </div>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="registerBtn">
                    <span>✨</span><span>إنشاء الحساب</span>
                </button>
            </form>
        </div>
    </div>

    <div class="bottom-links">
        <a href="index.html" class="back-home">← العودة للصفحة الرئيسية</a>
        <button type="button" class="delete-account" onclick="deleteAccount()">🗑️ حذف الحساب</button>
    </div>
</div>

<script>
    function updateHeaderImage(title) {
        const header = document.getElementById('headerSection');
        if (title === 'مس') { header.style.backgroundImage = "url('miss.png')"; } 
        else { header.style.backgroundImage = "url('teacher.png')"; }
    }

    function togglePin(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; } 
        else { input.type = 'password'; btn.textContent = '👁️'; }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-view').forEach(v => v.classList.remove('active'));
        hideMessages();
        if (tab === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('loginView').classList.add('active');
        } else {
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('registerView').classList.add('active');
            updateHeaderImage(document.getElementById('regTitle').value || 'مستر');
        }
    }

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
        document.getElementById('successText').textContent = msg;
        document.getElementById('successMsg').classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
    }

    function hideMessages() {
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function handleLogin(e) {
        e.preventDefault();
        hideMessages();
        const phone = document.getElementById('loginPhone').value.trim();
        const pin = document.getElementById('loginPin').value.trim();

        if (phone.length !== 11 || pin.length !== 4) return showError('تأكد من البيانات المدخلة');

        db.collection("teachers").doc(phone).get().then(doc => {
            if (doc.exists) {
                const user = doc.data();
                if (user.pin === pin) {
                    localStorage.setItem('current_teacher_profile', JSON.stringify(user));
                    localStorage.setItem('current_teacher_phone', user.phone);
                    showSuccess('✅ تم تسجيل الدخول بنجاح! جاري التحويل...');
                    setTimeout(() => { window.location.href = 'mester1.html'; }, 500);
                } else { showError('الرقم السري غير صحيح.'); }
            } else { showError('رقم التليفون غير مسجل لدينا.'); }
        }).catch(err => showError('خطأ في الاتصال بقاعدة البيانات.'));
    }

    function handleRegister(e) {
        e.preventDefault();
        hideMessages();

        const title = document.getElementById('regTitle').value;
        const age = document.getElementById('regAge').value.trim();
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pin = document.getElementById('regPin').value.trim();
        const pinConfirm = document.getElementById('regPinConfirm').value.trim();

        if (pin !== pinConfirm) return showError('الرقم السري وتأكيده غير متطابقين.');
        if (age.length !== 2) return showError('العمر يجب أن يكون رقمين.');

        const teacherData = { id: phone, title, age, name, phone, pin, role: 'teacher', registeredAt: new Date().toISOString() };
        
        db.collection("teachers").doc(phone).set(teacherData).then(() => {
            localStorage.setItem('current_teacher_profile', JSON.stringify(teacherData));
            localStorage.setItem('current_teacher_phone', phone);
            showSuccess('🎉 تم إنشاء حسابك بنجاح! جاري التحويل...');
            setTimeout(() => { window.location.href = 'mester1.html'; }, 500);
        }).catch(err => showError('خطأ في الاتصال بقاعدة البيانات.'));
    }

    function deleteAccount() {
        const phone = prompt('لحذف حسابك، يرجى إدخال رقم التليفون الخاص بك:');
        if (phone) {
            db.collection("teachers").doc(phone).get().then(doc => {
                if (doc.exists) {
                    const pin = prompt('يرجى إدخال الرقم السري المكون من 4 أرقام لتأكيد الحذف:');
                    if (doc.data().pin === pin && confirm('هل أنت متأكد من حذف الحساب نهائياً؟')) {
                        db.collection("teachers").doc(phone).delete().then(() => {
                            if (localStorage.getItem('current_teacher_phone') === phone) {
                                localStorage.removeItem('current_teacher_profile');
                                localStorage.removeItem('current_teacher_phone');
                            }
                            alert('تم حذف الحساب بنجاح.');
                            window.location.reload();
                        });
                    } else { alert('الرقم السري غير صحيح أو تم إلغاء العملية.'); }
                } else { alert('رقم التليفون غير مسجل لدينا.'); }
            });
        }
    }
</script>

</body>
</html>
