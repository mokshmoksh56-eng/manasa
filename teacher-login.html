<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دخول المعلم - منصة احجزلي</title>
<!-- مكتبات Firebase Compat لتعمل على الموبايل بدون سيرفر -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { min-height: 100vh; background: linear-gradient(180deg, #e8f0fa 0%, #d4e3f7 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(26, 60, 109, 0.15); max-width: 440px; width: 100%; overflow: hidden; }
    .login-header { background: linear-gradient(180deg, rgba(43, 92, 158, 0.95) 0%, rgba(26, 60, 109, 0.98) 100%), url('teacher2.png') center/cover no-repeat; padding: 30px 25px 35px; text-align: center; position: relative; border-bottom: 4px solid #f1c40f; }
    .login-header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #f1c40f 0%, #f39c12 100%); }
    .login-icon { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.15); border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; backdrop-filter: blur(5px); }
    .login-header h1 { font-size: 26px; font-weight: 900; color: #f1c40f; margin-bottom: 5px; text-shadow: 0 2px 0 #8a6d00, 0 4px 8px rgba(0,0,0,0.3); }
    .login-header p { font-size: 13px; color: #d0d9e8; font-weight: 600; }
    .tabs { display: flex; background: #f1f5f9; border-radius: 12px; margin: 20px 25px 0; padding: 5px; gap: 5px; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 900; color: #64748b; background: transparent; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
    .tab.active { background: linear-gradient(180deg, #2b5c9e 0%, #1a3c6d 100%); color: white; box-shadow: 0 4px 12px rgba(43, 92, 158, 0.3); }
    .login-body { padding: 25px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 900; color: #1a3c6d; margin-bottom: 8px; }
    .form-label .required { color: #dc3545; }
    .form-input { width: 100%; padding: 14px 16px; border: 2px solid #e0e4e8; border-radius: 12px; font-size: 16px; font-weight: 700; color: #1a3c6d; background: #fff; transition: all 0.2s ease; font-family: inherit; }
    .form-input:focus { border-color: #2b5c9e; outline: none; box-shadow: 0 0 0 4px rgba(43, 92, 158, 0.1); }
    .form-input::placeholder { color: #94a3b8; font-weight: 500; }
    .form-input[dir="ltr"] { text-align: left; }
    .pin-wrapper { position: relative; }
    .pin-input { letter-spacing: 12px; font-size: 22px; text-align: center; font-weight: 900; padding-left: 50px; padding-right: 16px; }
    .pin-toggle { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: #f1f5f9; border: none; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .pin-toggle:hover { background: #e2e8f0; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(180deg, #2b5c9e 0%, #1a3c6d 100%); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #0d2342, 0 8px 15px rgba(0, 0, 0, 0.15); transition: 0.2s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .submit-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #0d2342; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .switch-link { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; font-weight: 700; }
    .switch-link button { background: none; border: none; color: #2b5c9e; font-weight: 900; cursor: pointer; text-decoration: underline; font-size: 13px; padding: 0; margin-right: 5px; }
    .switch-link button:hover { color: #1a3c6d; }
    .error-msg, .success-msg { padding: 12px 15px; border-radius: 10px; font-size: 13px; font-weight: 800; margin-bottom: 15px; display: none; align-items: center; gap: 8px; }
    .error-msg { background: #fef2f2; border: 2px solid #fecaca; color: #991b1b; }
    .success-msg { background: #f0fdf4; border: 2px solid #bbf7d0; color: #166534; }
    .error-msg.show, .success-msg.show { display: flex; }
    .form-view { display: none; }
    .form-view.active { display: block; }
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
    .loading-overlay.show { display: flex; }
    .loading-box { background: white; border-radius: 16px; padding: 30px 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .loading-spinner { width: 45px; height: 45px; border: 5px solid #e0e4e8; border-top-color: #2b5c9e; border-radius: 50%; margin: 0 auto 15px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #1a3c6d; font-weight: 900; font-size: 14px; }
    .back-home { display: block; text-align: center; margin: 15px 25px 25px; color: #64748b; text-decoration: none; font-size: 13px; font-weight: 700; }
    .back-home:hover { color: #2b5c9e; }
    @media (max-width: 500px) { .login-card { border-radius: 18px; } .login-header { padding: 25px 20px 30px; } .login-icon { width: 65px; height: 65px; font-size: 32px; } .login-header h1 { font-size: 22px; } .login-body { padding: 20px; } .tabs { margin: 18px 20px 0; } .tab { padding: 10px; font-size: 13px; } }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="login-icon">👨‍🏫</div>
        <h1>بوابة المعلم</h1>
        <p>منصة احجزلي - دخول المعلمين</p>
    </div>
    <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">🔐 تسجيل دخول</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">✍️ حساب جديد</button>
    </div>
    <div class="login-body">
        <div class="error-msg" id="errorMsg"><span>⚠️</span><span id="errorText"></span></div>
        <div class="success-msg" id="successMsg"><span>✅</span><span id="successText"></span></div>
        
        <div class="form-view active" id="loginView">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                    <input type="tel" id="loginPhone" class="form-input" placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" maxlength="11" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>
                <div class="form-group">
                    <label class="form-label">🔒 الرقم السري (4 أرقام) <span class="required">*</span></label>
                    <div class="pin-wrapper">
                        <input type="password" id="loginPin" class="form-input pin-input" placeholder="••••" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        <button type="button" class="pin-toggle" onclick="togglePin('loginPin', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn"><span>🚀</span><span>تسجيل الدخول</span></button>
            </form>
            <div class="switch-link">ليس لديك حساب؟ <button type="button" onclick="switchTab('register')">أنشئ حساب جديد</button></div>
        </div>

        <div class="form-view" id="registerView">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">👤 الاسم الكامل <span class="required">*</span></label>
                    <input type="text" id="regName" class="form-input" placeholder="مثال: أحمد محمد" required maxlength="50">
                </div>
                <div class="form-group">
                    <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                    <input type="tel" id="regPhone" class="form-input" placeholder="01xxxxxxxxx" pattern="01[0125][0-9]{8}" maxlength="11" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>
                <div class="form-group">
                    <label class="form-label">🔒 الرقم السري (4 أرقام) <span class="required">*</span></label>
                    <div class="pin-wrapper">
                        <input type="password" id="regPin" class="form-input pin-input" placeholder="••••" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        <button type="button" class="pin-toggle" onclick="togglePin('regPin', this)">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">🔒 تأكيد الرقم السري <span class="required">*</span></label>
                    <div class="pin-wrapper">
                        <input type="password" id="regPinConfirm" class="form-input pin-input" placeholder="••••" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required dir="ltr" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        <button type="button" class="pin-toggle" onclick="togglePin('regPinConfirm', this)">👁️️</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="registerBtn"><span>✨</span><span>إنشاء الحساب</span></button>
            </form>
            <div class="switch-link">لديك حساب بالفعل؟ <button type="button" onclick="switchTab('login')">سجّل دخول</button></div>
        </div>
    </div>
    <a href="index.html" class="back-home">← العودة للصفحة الرئيسية</a>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box"><div class="loading-spinner"></div><div class="loading-text" id="loadingText">جاري التحقق...</div></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC9EXJnOL6ReTB41Kc8SXMcnK657_h2Mwc",
      authDomain: "tagroba-fbe9b.firebaseapp.com",
      databaseURL: "https://tagroba-fbe9b-default-rtdb.firebaseio.com",
      projectId: "tagroba-fbe9b",
      storageBucket: "tagroba-fbe9b.firebasestorage.app",
      messagingSenderId: "238106301728",
      appId: "1:238106301728:web:549602e55f7fe8a7b0b345",
      measurementId: "G-CRVE7VMZMS"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const PIN_PREFIX = 'Agz@'; const PIN_SUFFIX = '#T26';
    function pinToPassword(pin) { return `${PIN_PREFIX}${pin}${PIN_SUFFIX}`; }
    function phoneToEmail(phone) { return `${phone}@teacher.ahgazly.app`; }

    function togglePin(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; } 
        else { input.type = 'password'; btn.textContent = '👁️'; }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-view').forEach(v => v.classList.remove('active'));
        hideMessages();
        if (tab === 'login') { document.getElementById('tabLogin').classList.add('active'); document.getElementById('loginView').classList.add('active'); } 
        else { document.getElementById('tabRegister').classList.add('active'); document.getElementById('registerView').classList.add('active'); }
    }

    function showError(msg) { document.getElementById('errorText').textContent = msg; document.getElementById('errorMsg').classList.add('show'); document.getElementById('successMsg').classList.remove('show'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function showSuccess(msg) { document.getElementById('successText').textContent = msg; document.getElementById('successMsg').classList.add('show'); document.getElementById('errorMsg').classList.remove('show'); }
    function hideMessages() { document.getElementById('errorMsg').classList.remove('show'); document.getElementById('successMsg').classList.remove('show'); }
    function showLoading(text = 'جاري التحقق...') { document.getElementById('loadingText').textContent = text; document.getElementById('loadingOverlay').classList.add('show'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

    async function handleLogin(e) {
        e.preventDefault(); hideMessages();
        const phone = document.getElementById('loginPhone').value.trim();
        const pin = document.getElementById('loginPin').value.trim();

        const btn = document.getElementById('loginBtn');
        const originalText = btn.innerHTML; btn.disabled = true;
        showLoading('جاري تسجيل الدخول...');

        try {
            const email = phoneToEmail(phone);
            const password = pinToPassword(pin);
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            
            let teacherName = 'معلم'; let teacherPhone = phone;
            try {
                const teacherDoc = await db.collection('teachers').doc(userCredential.user.uid).get();
                if (teacherDoc.exists) {
                    teacherName = teacherDoc.data().name || 'معلم';
                    teacherPhone = teacherDoc.data().phone || phone;
                }
            } catch (e) {}

            localStorage.setItem('current_teacher_profile', JSON.stringify({ id: userCredential.user.uid, name: teacherName, phone: teacherPhone }));
            showSuccess('✅ تم تسجيل الدخول بنجاح! جاري التحويل...');
            setTimeout(() => { window.location.href = 'mester1.html'; }, 800);
        } catch (error) {
            hideLoading(); btn.disabled = false; btn.innerHTML = originalText;
            showError('رقم التليفون أو الرقم السري غير صحيح.');
        }
    }

    async function handleRegister(e) {
        e.preventDefault(); hideMessages();
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pin = document.getElementById('regPin').value.trim();
        const pinConfirm = document.getElementById('regPinConfirm').value.trim();

        if (pin !== pinConfirm) { showError('الرقم السري وتأكيده غير متطابقين.'); return; }

        const btn = document.getElementById('registerBtn');
        const originalText = btn.innerHTML; btn.disabled = true;
        showLoading('جاري إنشاء حسابك...');

        try {
            const email = phoneToEmail(phone);
            const password = pinToPassword(pin);
            let userCredential; let isNewUser = true;

            try {
                userCredential = await auth.createUserWithEmailAndPassword(email, password);
            } catch (err) {
                if (err.code === 'auth/email-already-in-use') {
                    try {
                        userCredential = await auth.signInWithEmailAndPassword(email, password);
                        isNewUser = false;
                    } catch (loginErr) {
                        throw new Error('هذا الرقم مسجل بكلمة سر مختلفة. جرب تسجيل الدخول.');
                    }
                } else { throw err; }
            }

            await db.collection('teachers').doc(userCredential.user.uid).set({
                name: name, phone: phone, email: email, role: 'teacher',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                ...(isNewUser ? { createdAt: firebase.firestore.FieldValue.serverTimestamp() } : {})
            }, { merge: true });

            localStorage.setItem('current_teacher_profile', JSON.stringify({ id: userCredential.user.uid, name: name, phone: phone }));
            showSuccess(isNewUser ? '🎉 تم إنشاء حسابك بنجاح!' : '✅ تم تحديث بياناتك!');
            setTimeout(() => { window.location.href = 'mester1.html'; }, 1000);
        } catch (error) {
            hideLoading(); btn.disabled = false; btn.innerHTML = originalText;
            showError(error.message || 'فشل إنشاء الحساب.');
        }
    }
</script>
</body>
</html>
