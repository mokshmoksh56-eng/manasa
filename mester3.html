<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>منصة احجزلي - بوابة المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-teal: #009688;
        --dark-teal: #00695c;
        --light-teal: #e0f2f0;
        --border-teal: #b2dfdb;
        --bg-color: #f7f9fa;
        --text-dark: #1e293b;
        --text-gray: #64748b;
        --white: #ffffff;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Cairo', sans-serif;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: var(--bg-color);
        padding-bottom: 40px;
        color: var(--text-dark);
        min-height: 100vh;
    }

    /* ============ الهيدر ============ */
    .header-3d {
        width: 100%;
        background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.6) 100%),
                    url('teacher2.png') center/cover no-repeat;
        padding: 24px 15px 28px;
        text-align: center;
        position: relative;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .header-3d h1 {
        font-size: 22px;
        font-weight: 900;
        color: #fff;
        margin-bottom: 4px;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.7);
    }
    .header-3d p {
        font-size: 13px;
        color: #e2e8f0;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .cloud-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(6px);
        z-index: 100;
    }
    .cloud-badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22C55E;
        box-shadow: 0 0 8px #22C55E;
        animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    /* ============ الحاوية ============ */
    .main-container {
        width: 100%;
        max-width: 900px;
        margin: 15px auto 0;
        padding: 0 12px;
        position: relative;
        z-index: 10;
    }

    /* ============ القائمة المنسدلة (Accordion) ============ */
    .accordion-section {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08), 0 3px 8px rgba(0,150,136,0.06);
        margin-bottom: 15px;
        overflow: hidden;
        border: 2px solid #e2e8f0;
        transition: all 0.3s ease;
    }

    .accordion-section.active {
        border-color: var(--primary-teal);
        box-shadow: 0 12px 30px rgba(0,150,136,0.18);
    }

    .accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        cursor: pointer;
        user-select: none;
        background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
        transition: background 0.25s;
        gap: 10px;
        flex-wrap: wrap;
    }
    .accordion-header:hover {
        background: linear-gradient(135deg, #f1f5f9 0%, #f8fafc 100%);
    }
    .accordion-section.active .accordion-header {
        background: linear-gradient(135deg, var(--light-teal) 0%, #f0fdf9 100%);
        border-bottom: 2px dashed var(--border-teal);
    }

    .acc-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
    }

    .acc-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        background: var(--primary-teal);
        color: #fff;
        border-radius: 10px;
        font-size: 17px;
        font-weight: 900;
        flex-shrink: 0;
        box-shadow: 0 3px 8px rgba(0,150,136,0.3);
        transition: all 0.25s;
    }
    .accordion-section.active .acc-number {
        background: var(--dark-teal);
        transform: scale(1.05);
    }

    .acc-title-block {
        flex: 1;
        min-width: 0;
    }

    .acc-title {
        font-size: 16px;
        font-weight: 900;
        color: var(--text-dark);
        line-height: 1.3;
    }
    .accordion-section.active .acc-title {
        color: var(--dark-teal);
    }

    .acc-subtitle {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text-gray);
        margin-top: 2px;
    }

    .acc-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #10B981;
        color: #fff;
        font-size: 10.5px;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 20px;
        box-shadow: 0 2px 6px rgba(16,185,129,0.4);
        white-space: nowrap;
    }
    .acc-status-badge.pending {
        background: #F59E0B;
        box-shadow: 0 2px 6px rgba(245,158,11,0.4);
        animation: badgePulse 2s infinite;
    }
    @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    .acc-arrow {
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 8px solid var(--text-gray);
        transition: transform 0.3s ease;
        flex-shrink: 0;
    }
    .accordion-section.active .acc-arrow {
        transform: rotate(180deg);
        border-top-color: var(--primary-teal);
    }

    /* ============ جسم القائمة (iframe) ============ */
    .accordion-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        background: #f7f9fa;
    }
    .accordion-section.active .accordion-body {
        max-height: 20000px;
    }

    .accordion-body iframe {
        width: 100%;
        border: none;
        display: block;
        background: #f7f9fa;
        min-height: 700px;
        height: 700px;
        transition: height 0.3s;
    }

    /* لو المرحلة مقفولة، نخفي الـ iframe */
    .accordion-section:not(.active) .accordion-body iframe {
        height: 0;
        min-height: 0;
    }

    /* ============ شاشة حماية ============ */
    .security-overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #009688 0%, #00695c 100%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        gap: 20px;
        transition: opacity 0.3s ease;
    }
    .security-overlay.hide {
        opacity: 0;
        pointer-events: none;
    }
    .security-spinner {
        width: 60px;
        height: 60px;
        border: 5px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .security-overlay h2 {
        font-size: 20px;
        font-weight: 900;
    }
    .security-overlay p {
        font-size: 14px;
        opacity: 0.9;
    }

    /* ============ توست التنبيه ============ */
    .toast-notice {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: linear-gradient(135deg, #F59E0B, #D97706);
        color: #fff;
        padding: 12px 22px;
        border-radius: 24px;
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 8px 20px rgba(245,158,11,0.5);
        z-index: 99999;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 90%;
        text-align: center;
    }
    .toast-notice.show {
        transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
        .acc-title { font-size: 14.5px; }
        .acc-subtitle { font-size: 11px; }
        .acc-number { width: 34px; height: 34px; font-size: 15px; }
        .accordion-body iframe { min-height: 600px; height: 600px; }
    }
</style>
</head>
<body>

    <!-- ✅ شاشة حماية أولية -->
    <div class="security-overlay" id="securityOverlay">
        <div class="security-spinner"></div>
        <h2>جاري التحقق من الجهاز...</h2>
        <p>منصة احجزلي تحمي حسابك</p>
    </div>

    <!-- ✅ توست التنبيه -->
    <div class="toast-notice" id="toastNotice">
        <span>⚠️</span>
        <span id="toastText">يجب حفظ التخصص أولاً</span>
    </div>

    <!-- ============ الهيدر ============ -->
    <header class="header-3d">
        <div class="cloud-badge" id="cloudBadge">
            <span class="dot"></span>
            <span id="cloudText">متصل</span>
        </div>
        <h1>منصة احجزلي</h1>
        <p>بوابة المعلم - إدارة المجموعات والدروس</p>
    </header>

    <!-- ============ القائمة المنسدلة ============ -->
    <div class="main-container">

        <!-- 🔽 القسم 1: التخصص -->
        <div class="accordion-section active" id="section-specialty">
            <div class="accordion-header" onclick="toggleSection('section-specialty')">
                <div class="acc-header-left">
                    <div class="acc-number">1</div>
                    <div class="acc-title-block">
                        <div class="acc-title">📚 التخصص</div>
                        <div class="acc-subtitle">اختر الصف والمواد التي تدرسها</div>
                    </div>
                </div>
                <span class="acc-status-badge pending" id="specialtyStatusBadge">
                    <span>⏳</span>
                    <span>مطلوب</span>
                </span>
                <div class="acc-arrow"></div>
            </div>
            <div class="accordion-body">
                <iframe 
                    id="iframe-specialty"
                    src="mester1.html"
                    title="التخصص"
                    loading="lazy"
                ></iframe>
            </div>
        </div>

        <!-- 🔽 القسم 2: المواعيد والمجموعات -->
        <div class="accordion-section" id="section-schedule">
            <div class="accordion-header" onclick="toggleSection('section-schedule')">
                <div class="acc-header-left">
                    <div class="acc-number">2</div>
                    <div class="acc-title-block">
                        <div class="acc-title">📅 المواعيد والمجموعات</div>
                        <div class="acc-subtitle">أضف المجموعات وحدد المواعيد</div>
                    </div>
                </div>
                <span class="acc-status-badge pending" id="scheduleStatusBadge">
                    <span>🔒</span>
                    <span>يحتاج تخصص</span>
                </span>
                <div class="acc-arrow"></div>
            </div>
            <div class="accordion-body">
                <iframe 
                    id="iframe-schedule"
                    src=""
                    data-src="mester2.html"
                    title="المواعيد والمجموعات"
                    loading="lazy"
                ></iframe>
            </div>
        </div>

    </div>

    <!-- ============ السكريبت ============ -->
    <script>
    (function() {
        'use strict';

        // ==========================================================
        // ✅ حالة القائمة المنسدلة
        // ==========================================================
        let scheduleLoaded = false;
        let specialtySaved = false;

        // ==========================================================
        // ✅ إخفاء شاشة الحماية بعد التحميل
        // ==========================================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                const overlay = document.getElementById('securityOverlay');
                if (overlay) {
                    overlay.classList.add('hide');
                    setTimeout(() => overlay.remove(), 400);
                }
            }, 600);
        });

        // ==========================================================
        // ✅ فحص حالة التخصص المحفوظ
        // ==========================================================
        function checkSpecialtyStatus() {
            try {
                const raw = localStorage.getItem('mester1_selections');
                const teacherSel = localStorage.getItem('teacherSelections');
                const isLocked = localStorage.getItem('mester1_is_locked');

                const parseSafe = (s) => {
                    if (!s) return null;
                    try { return JSON.parse(s); } catch(e) { return null; }
                };

                const data = parseSafe(raw) || parseSafe(teacherSel);
                if (!data || isLocked !== 'true') return false;

                for (const sid in data) {
                    if (data[sid]?.subjects?.length > 0) return true;
                }
                return false;
            } catch(e) {
                return false;
            }
        }

        // ==========================================================
        // ✅ تحديث البادجات
        // ==========================================================
        function updateBadges() {
            specialtySaved = checkSpecialtyStatus();

            const specialtyBadge = document.getElementById('specialtyStatusBadge');
            const scheduleBadge = document.getElementById('scheduleStatusBadge');

            // بادج التخصص
            if (specialtySaved) {
                specialtyBadge.className = 'acc-status-badge';
                specialtyBadge.innerHTML = '<span>✅</span><span>تم الحفظ</span>';
            } else {
                specialtyBadge.className = 'acc-status-badge pending';
                specialtyBadge.innerHTML = '<span>⏳</span><span>مطلوب</span>';
            }

            // بادج المواعيد
            if (specialtySaved) {
                scheduleBadge.className = 'acc-status-badge';
                scheduleBadge.innerHTML = '<span>✅</span><span>متاح</span>';
            } else {
                scheduleBadge.className = 'acc-status-badge pending';
                scheduleBadge.innerHTML = '<span>🔒</span><span>يحتاج تخصص</span>';
            }
        }

        // ==========================================================
        // ✅ فتح / قفل قسم
        // ==========================================================
        window.toggleSection = function(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;

            const isActive = section.classList.contains('active');

            // لو بنقفل القسم — نقفله
            if (isActive) {
                section.classList.remove('active');
                return;
            }

            // لو بنفتح قسم المواعيد — لازم التخصص يكون محفوظ
            if (sectionId === 'section-schedule') {
                updateBadges();
                if (!specialtySaved) {
                    showToast('⚠️ يجب حفظ التخصص أولاً قبل المواعيد');
                    // نفتح قسم التخصص تلقائياً
                    const specialtySection = document.getElementById('section-specialty');
                    if (specialtySection) specialtySection.classList.add('active');
                    return;
                }

                // نحمّل mester2.html لو لأول مرة
                if (!scheduleLoaded) {
                    const iframe = document.getElementById('iframe-schedule');
                    if (iframe && !iframe.src) {
                        iframe.src = iframe.dataset.src;
                        scheduleLoaded = true;
                    }
                }
            }

            // نفتح القسم المطلوب
            section.classList.add('active');

            // لو فتحنا قسم — نقفل أي قسم تاني (سلوك Accordion)
            document.querySelectorAll('.accordion-section').forEach(s => {
                if (s.id !== sectionId) s.classList.remove('active');
            });

            // Scroll للقسم بعد الفتح
            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 350);
        };

        // ==========================================================
        // ✅ توست التنبيه
        // ==========================================================
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toastNotice');
            const txt = document.getElementById('toastText');
            if (!toast || !txt) return;

            txt.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==========================================================
        // ✅ الاستماع للرسائل من الـ iframe
        // ==========================================================
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || typeof data !== 'object') return;

            // لما يحفظ التخصص في mester1
            if (data.type === 'specialty_saved') {
                console.log('✅ تم حفظ التخصص من mester1');
                updateBadges();

                // نفتح قسم المواعيد تلقائياً
                setTimeout(() => {
                    const scheduleSection = document.getElementById('section-schedule');
                    const specialtySection = document.getElementById('section-specialty');

                    if (specialtySection) specialtySection.classList.remove('active');
                    if (scheduleSection) {
                        scheduleSection.classList.add('active');
                        // نحمّل mester2
                        const iframe = document.getElementById('iframe-schedule');
                        if (iframe && !iframe.src) {
                            iframe.src = iframe.dataset.src;
                            scheduleLoaded = true;
                        }
                        setTimeout(() => {
                            scheduleSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 350);
                    }
                }, 300);
            }

            // لما يتعدل التخصص
            if (data.type === 'specialty_updated') {
                console.log('🔄 تم تحديث التخصص');
                updateBadges();
                // نعمل reload لـ mester2 عشان يجيب البيانات الجديدة
                const iframe2 = document.getElementById('iframe-schedule');
                if (iframe2 && iframe2.src) {
                    iframe2.src = iframe2.src;
                }
            }
        });

        // ==========================================================
        // ✅ التهيئة
        // ==========================================================
        window.addEventListener('DOMContentLoaded', () => {
            updateBadges();
            console.log('✅ mester3 جاهز');

            // لو التخصص محفوظ من قبل — نفتح قسم المواعيد ونحمّل mester2
            if (specialtySaved) {
                setTimeout(() => {
                    const specialtySection = document.getElementById('section-specialty');
                    const scheduleSection = document.getElementById('section-schedule');

                    if (specialtySection) specialtySection.classList.remove('active');
                    if (scheduleSection) {
                        scheduleSection.classList.add('active');
                        const iframe = document.getElementById('iframe-schedule');
                        if (iframe && !iframe.src) {
                            iframe.src = iframe.dataset.src;
                            scheduleLoaded = true;
                        }
                    }
                }, 500);
            }
        });

        // ==========================================================
        // ✅ فحص دوري لحالة التخصص (كل 3 ثواني)
        // ==========================================================
        setInterval(updateBadges, 3000);

    })();
    </script>

    <!-- ==========================================================
         🔊 سكريبت تعديل mester1 عشان يبعت رسالة لما يحفظ
         (بيتنفذ جوه الـ iframe — لكن هنضيفه هنا للتوضيح)
    ========================================================== -->
    <script>
        // ملاحظة: السكريبت ده بيتنفذ في mester3 فقط
        // عشان mester1 يبعت رسالة، لازم نضيف كود صغير في mester1.html
        // هنشوفه تحت في التعليمات
    </script>

</body>
</html>
