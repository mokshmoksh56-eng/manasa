<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>منصة احجزلي - بوابة المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-teal: #009688;
        --dark-teal: #00695c;
        --light-teal: #e0f2f0;
        --border-teal: #b2dfdb;
        --bg-color: #f7f9fa;
        --text-dark: #1e293b;
        --text-gray: #64748b;
        --white: #ffffff;
        --orange: #F59E0B;
        --dark-orange: #D97706;
        --red: #DC2626;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Cairo', sans-serif;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: var(--bg-color);
        color: var(--text-dark);
        min-height: 100vh;
        padding-bottom: 30px;
        overflow-x: hidden;
        position: relative;
    }

    /* ✨ خلفية متحركة */
    .animated-bg {
        position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        background: linear-gradient(135deg, #f7f9fa 0%, #e0f2f0 25%, #f7f9fa 50%, #fef3c7 75%, #f7f9fa 100%);
        background-size: 400% 400%;
        animation: gradientMove 18s ease infinite;
    }
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .floating-shape { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.35; will-change: transform; }
    .shape-1 { width: 380px; height: 380px; background: radial-gradient(circle, #009688, transparent 70%); top: -100px; right: -100px; animation: floatShape1 20s ease-in-out infinite; }
    .shape-2 { width: 320px; height: 320px; background: radial-gradient(circle, #F59E0B, transparent 70%); bottom: -80px; left: -80px; animation: floatShape2 25s ease-in-out infinite; }
    .shape-3 { width: 260px; height: 260px; background: radial-gradient(circle, #7C3AED, transparent 70%); top: 40%; left: 50%; animation: floatShape3 22s ease-in-out infinite; }
    .shape-4 { width: 220px; height: 220px; background: radial-gradient(circle, #10B981, transparent 70%); top: 20%; left: 10%; animation: floatShape4 28s ease-in-out infinite; }
    @keyframes floatShape1 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(-80px,100px) scale(1.15); } 66% { transform: translate(50px,50px) scale(0.9); } }
    @keyframes floatShape2 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(100px,-80px) scale(1.2); } 66% { transform: translate(-40px,-120px) scale(0.95); } }
    @keyframes floatShape3 { 0%,100% { transform: translate(-50%,0) scale(1); } 50% { transform: translate(-30%,-60px) scale(1.25); } }
    @keyframes floatShape4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,80px) scale(1.1); } }

    .decorative-lines { position: absolute; inset: 0; overflow: hidden; }
    .decorative-lines::before, .decorative-lines::after {
        content: ''; position: absolute; border-radius: 50%; border: 2px dashed rgba(0,150,136,0.15);
    }
    .decorative-lines::before { width: 500px; height: 500px; top: -200px; left: -200px; animation: rotateSlow 60s linear infinite; }
    .decorative-lines::after { width: 700px; height: 700px; bottom: -300px; right: -300px; border-color: rgba(245,158,11,0.12); animation: rotateSlow 80s linear infinite reverse; }
    @keyframes rotateSlow { to { transform: rotate(360deg); } }

    /* الهيدر */
    .header-3d {
        width: 100%;
        background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.65) 100%), url('teacher2.png') center/cover no-repeat;
        padding: 30px 15px 40px;
        text-align: center;
        position: relative;
        box-shadow: 0 4px 18px rgba(0,0,0,0.18);
        z-index: 5;
    }
    .header-3d h1 { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 6px; letter-spacing: 0.5px; text-shadow: 0 3px 8px rgba(0,0,0,0.7); }
    .header-3d p { font-size: 13.5px; color: #e2e8f0; font-weight: 700; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }

    .cloud-badge {
        position: absolute; top: 12px; left: 12px;
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        color: #fff; padding: 6px 12px; border-radius: 20px;
        font-size: 11px; font-weight: 900;
        display: flex; align-items: center; gap: 6px; backdrop-filter: blur(6px);
    }
    .cloud-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 8px #22C55E; animation: pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .user-actions { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 8px; z-index: 10; }
    .user-badge {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        color: #fff; padding: 6px 12px; border-radius: 20px;
        font-size: 11px; font-weight: 900;
        display: flex; align-items: center; gap: 6px; backdrop-filter: blur(6px);
        max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .logout-btn {
        background: rgba(220,38,38,0.85); border: 1px solid rgba(255,255,255,0.3);
        color: #fff; padding: 6px 12px; border-radius: 20px;
        font-size: 11px; font-weight: 900;
        display: flex; align-items: center; gap: 5px;
        backdrop-filter: blur(6px); cursor: pointer;
        transition: all 0.25s ease; font-family: inherit;
        box-shadow: 0 3px 10px rgba(220,38,38,0.35);
    }
    .logout-btn:hover { background: rgba(220,38,38,1); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(220,38,38,0.6); }
    .logout-btn:active { transform: translateY(0) scale(0.96); }

    .main-container { width: 100%; max-width: 900px; margin: -20px auto 0; padding: 0 12px; position: relative; z-index: 10; }

    /* ========================================================== */
    /* 🎯 القائمة المنسدلة (Accordion) */
    /* ========================================================== */
    .accordion-section {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08), 0 3px 8px rgba(0,150,136,0.06);
        margin-bottom: 14px;
        overflow: hidden;
        border: 2px solid #e2e8f0;
        transition: all 0.3s ease;
    }

    .accordion-section.active {
        border-color: var(--primary-teal);
        box-shadow: 0 12px 30px rgba(0,150,136,0.2);
    }
    .accordion-section.active.schedule-section {
        border-color: var(--orange);
        box-shadow: 0 12px 30px rgba(245,158,11,0.2);
    }

    .accordion-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        cursor: pointer;
        user-select: none;
        background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
        transition: background 0.25s;
        position: relative;
    }

    .accordion-header:hover {
        background: linear-gradient(135deg, #f1f5f9 0%, #f8fafc 100%);
    }

    .accordion-section.active .accordion-header {
        background: linear-gradient(135deg, var(--light-teal) 0%, #f0fdf9 100%);
        border-bottom: 2px dashed var(--border-teal);
    }
    .accordion-section.active.schedule-section .accordion-header {
        background: linear-gradient(135deg, #FEF3C7 0%, #FFFBEB 100%);
        border-bottom: 2px dashed #FCD34D;
    }

    .acc-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--primary-teal);
        color: #fff;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 900;
        flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(0,150,136,0.35);
        transition: all 0.3s ease;
    }

    .accordion-section.active .acc-number {
        background: var(--dark-teal);
        transform: scale(1.05);
    }

    .schedule-section .acc-number {
        background: linear-gradient(135deg, var(--orange), var(--dark-orange));
        box-shadow: 0 4px 10px rgba(245,158,11,0.35);
    }
    .accordion-section.active.schedule-section .acc-number {
        background: var(--dark-orange);
    }

    .acc-title-block { flex: 1; min-width: 0; }
    .acc-title { font-size: 16px; font-weight: 900; color: var(--text-dark); line-height: 1.3; }
    .accordion-section.active .acc-title { color: var(--dark-teal); }
    .accordion-section.active.schedule-section .acc-title { color: var(--dark-orange); }

    .acc-subtitle { font-size: 12px; font-weight: 700; color: var(--text-gray); margin-top: 2px; }

    .acc-arrow {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-gray);
        font-size: 14px;
        font-weight: 900;
        flex-shrink: 0;
        transition: all 0.3s ease;
    }

    .accordion-section.active .acc-arrow {
        background: var(--primary-teal);
        color: #fff;
        transform: rotate(180deg);
    }
    .accordion-section.active.schedule-section .acc-arrow {
        background: var(--orange);
    }

    /* جسم الأكورديون */
    .accordion-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        background: #f7f9fa;
    }

    .accordion-section.active .accordion-body {
        max-height: 20000px;
    }

    .accordion-body iframe {
        width: 100%;
        height: 0;
        border: none;
        display: block;
        background: #f7f9fa;
        transition: height 0.4s ease;
    }

    .accordion-section.active .accordion-body iframe {
        height: 90vh;
        min-height: 600px;
    }

    /* توست */
    .toast-notice {
        position: fixed; top: 20px; left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: linear-gradient(135deg, #F59E0B, #D97706);
        color: #fff; padding: 12px 22px; border-radius: 24px;
        font-size: 13px; font-weight: 900;
        box-shadow: 0 8px 20px rgba(245,158,11,0.5);
        z-index: 99999;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex; align-items: center; gap: 8px;
        max-width: 90%; text-align: center;
    }
    .toast-notice.show { transform: translateX(-50%) translateY(0); }

    /* نافذة تسجيل الخروج */
    .logout-modal-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.55); z-index: 100000;
        justify-content: center; align-items: center;
        padding: 20px; backdrop-filter: blur(4px);
    }
    .logout-modal-overlay.active { display: flex; }
    .logout-modal-box {
        background: #fff; border-radius: 20px;
        width: 100%; max-width: 380px;
        padding: 26px 22px; text-align: center;
        box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        animation: modalPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPopIn { from { transform: scale(0.85) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    .logout-icon-wrap {
        width: 70px; height: 70px; border-radius: 50%;
        background: linear-gradient(135deg, #FEE2E2, #FECACA);
        display: flex; align-items: center; justify-content: center;
        font-size: 34px; margin: 0 auto 16px;
        box-shadow: 0 6px 18px -4px rgba(220,38,38,0.35);
    }
    .logout-modal-box h3 { font-size: 18px; font-weight: 900; color: #7F1D1D; margin-bottom: 8px; }
    .logout-modal-box p { font-size: 13.5px; font-weight: 700; color: #64748B; line-height: 1.6; margin-bottom: 22px; }
    .logout-modal-actions { display: flex; gap: 10px; }
    .logout-btn-confirm, .logout-btn-cancel {
        flex: 1; padding: 12px 16px; border-radius: 12px;
        font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 14px;
        cursor: pointer; border: none; transition: all 0.2s;
    }
    .logout-btn-confirm { background: linear-gradient(135deg, #DC2626, #991B1B); color: #fff; box-shadow: 0 6px 15px -4px rgba(220,38,38,0.6); }
    .logout-btn-confirm:hover { transform: translateY(-2px); }
    .logout-btn-cancel { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .logout-btn-cancel:hover { background: #e2e8f0; transform: translateY(-2px); }

    @media (max-width: 480px) {
        .header-3d { padding: 26px 15px 36px; }
        .header-3d h1 { font-size: 22px; }
        .header-3d p { font-size: 12px; }
        .acc-number { width: 36px; height: 36px; font-size: 16px; }
        .acc-title { font-size: 14.5px; }
        .acc-subtitle { font-size: 11px; }
        .accordion-header { padding: 14px 14px; gap: 10px; }
        .accordion-section.active .accordion-body iframe { height: 85vh; min-height: 500px; }
        .user-actions { gap: 5px; }
        .user-badge { font-size: 10px; padding: 5px 9px; max-width: 120px; }
        .logout-btn { font-size: 10px; padding: 5px 10px; }
        .logout-btn .logout-label { display: none; }
    }
</style>
</head>
<body>

    <!-- ✨ الخلفية المتحركة -->
    <div class="animated-bg">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
        <div class="decorative-lines"></div>
    </div>

    <!-- توست -->
    <div class="toast-notice" id="toastNotice">
        <span>⚠️</span>
        <span id="toastText">تنبيه</span>
    </div>

    <!-- 🚪 نافذة تسجيل الخروج -->
    <div class="logout-modal-overlay" id="logoutModalOverlay">
        <div class="logout-modal-box">
            <div class="logout-icon-wrap">🚪</div>
            <h3>تسجيل الخروج؟</h3>
            <p>هل أنت متأكد من رغبتك في تسجيل الخروج؟<br>
                <small style="color:#94A3B8; font-size:11.5px;">سيتم مسح بيانات الجلسة</small>
            </p>
            <div class="logout-modal-actions">
                <button class="logout-btn-cancel" onclick="closeLogoutModal()">إلغاء</button>
                <button class="logout-btn-confirm" onclick="confirmLogout()">نعم، خروج</button>
            </div>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="header-3d">
        <div class="cloud-badge">
            <span class="dot"></span>
            <span>متصل</span>
        </div>
        <div class="user-actions">
            <div class="user-badge" id="userBadge" style="display:none;">
                <span>👤</span>
                <span id="userName">المعلم</span>
            </div>
            <button class="logout-btn" onclick="openLogoutModal()" title="تسجيل الخروج">
                <span>🚪</span>
                <span class="logout-label">خروج</span>
            </button>
        </div>
        <h1>منصة احجزلي</h1>
        <p>بوابة المعلم - اختر القسم للبدء</p>
    </header>

    <!-- ========================================================== -->
    <!-- 🎯 القائمة المنسدلة -->
    <!-- ========================================================== -->
    <div class="main-container">

        <!-- 🔽 قسم التخصص -->
        <div class="accordion-section" id="section-specialty">
            <div class="accordion-header" onclick="toggleSection('section-specialty')">
                <div class="acc-number">1</div>
                <div class="acc-title-block">
                    <div class="acc-title">📚 التخصص</div>
                    <div class="acc-subtitle">اختر الصف والمواد التي تدرسها</div>
                </div>
                <div class="acc-arrow">▼</div>
            </div>
            <div class="accordion-body">
                <iframe 
                    id="iframe-specialty"
                    src=""
                    data-src="mester1.html"
                    title="التخصص"
                    loading="lazy"
                    allow="geolocation"
                ></iframe>
            </div>
        </div>

        <!-- 🔽 قسم المواعيد والمجموعات -->
        <div class="accordion-section schedule-section" id="section-schedule">
            <div class="accordion-header" onclick="toggleSection('section-schedule')">
                <div class="acc-number">2</div>
                <div class="acc-title-block">
                    <div class="acc-title">📅 المواعيد والمجموعات</div>
                    <div class="acc-subtitle">أضف المجموعات وحدد المواعيد والأماكن</div>
                </div>
                <div class="acc-arrow">▼</div>
            </div>
            <div class="accordion-body">
                <iframe 
                    id="iframe-schedule"
                    src=""
                    data-src="mester2.html"
                    title="المواعيد والمجموعات"
                    loading="lazy"
                    allow="geolocation"
                ></iframe>
            </div>
        </div>

    </div>

    <script>
    (function() {
        'use strict';

        // ==========================================================
        // 🎯 فتح / قفل القسم
        // ==========================================================
        window.toggleSection = function(sectionId) {
            const section = document.getElementById(sectionId);
            if (!section) return;

            const isActive = section.classList.contains('active');

            // لو مفتوح → اقفله
            if (isActive) {
                section.classList.remove('active');
                return;
            }

            // اقفل باقي الأقسام
            document.querySelectorAll('.accordion-section').forEach(s => {
                if (s.id !== sectionId) s.classList.remove('active');
            });

            // حمّل الـ iframe لو لسه محمّلش
            const iframe = section.querySelector('iframe');
            if (iframe && !iframe.src) {
                iframe.src = iframe.dataset.src;
            }

            // افتح القسم
            section.classList.add('active');

            // سكرول للقسم
            setTimeout(() => {
                const headerRect = section.getBoundingClientRect();
                const offset = 20;
                const targetY = window.pageYOffset + headerRect.top - offset;
                window.scrollTo({ top: targetY, behavior: 'smooth' });
            }, 150);
        };

        // ==========================================================
        // 🚪 تسجيل الخروج
        // ==========================================================
        window.openLogoutModal = function() {
            document.getElementById('logoutModalOverlay')?.classList.add('active');
        };
        window.closeLogoutModal = function() {
            document.getElementById('logoutModalOverlay')?.classList.remove('active');
        };
        window.confirmLogout = function() {
            try {
                localStorage.removeItem('current_teacher_phone');
                localStorage.removeItem('current_teacher_profile');
                localStorage.removeItem('teacher_is_blocked');
                localStorage.removeItem('mester1_selections');
                localStorage.removeItem('teacherSelections');
                localStorage.removeItem('mester1_is_locked');
                localStorage.removeItem('teacher_groups_count');
                localStorage.removeItem('selected_contact_type');
                closeLogoutModal();
                setTimeout(() => { window.location.href = 'teacher-login.html'; }, 250);
            } catch(e) {
                window.location.href = 'teacher-login.html';
            }
        };

        document.addEventListener('click', (e) => {
            const modal = document.getElementById('logoutModalOverlay');
            if (modal && e.target === modal) closeLogoutModal();
        });

        // ==========================================================
        // 👤 عرض اسم المعلم
        // ==========================================================
        function showTeacherName() {
            try {
                const profile = JSON.parse(localStorage.getItem('current_teacher_profile') || '{}');
                const name = profile.name || profile.teacherName || '';
                const title = profile.title || '';
                if (name) {
                    const badge = document.getElementById('userBadge');
                    const nameEl = document.getElementById('userName');
                    if (badge && nameEl) {
                        nameEl.textContent = `${title} ${name}`.trim();
                        badge.style.display = 'flex';
                    }
                }
            } catch(e) {}
        }

        // ==========================================================
        // 🎯 التهيئة
        // ==========================================================
        window.addEventListener('DOMContentLoaded', () => {
            showTeacherName();
            console.log('✅ mester3 جاهز (Accordion)');

            // افتح قسم التخصص تلقائياً لو مفيش تخصص محفوظ
            try {
                const saved = localStorage.getItem('mester1_selections') || localStorage.getItem('teacherSelections');
                const hasSpecialty = saved && saved !== '{}' && saved !== 'null';
                
                if (!hasSpecialty) {
                    // مفيش تخصص → افتح قسم التخصص
                    toggleSection('section-specialty');
                } else {
                    // فيه تخصص → افتح قسم المواعيد
                    toggleSection('section-schedule');
                }
            } catch(e) {
                toggleSection('section-specialty');
            }
        });

        // ==========================================================
        // 🔄 استماع لرسائل الـ iframe
        // ==========================================================
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;

            if (data.type === 'specialty_saved') {
                console.log('✅ تم حفظ التخصص من داخل iframe');
                // اقفل قسم التخصص وافتح قسم المواعيد
                document.getElementById('section-specialty')?.classList.remove('active');
                setTimeout(() => {
                    toggleSection('section-schedule');
                }, 500);
            }
        });

    })();
    </script>

</body>
</html>
