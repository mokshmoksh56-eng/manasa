<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>منصة احجزلي - إعداد المجموعة والمواعيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<style>
    :root { --primary-teal:#25968b; --dark-teal:#1b736a; --light-teal:#e0f2f0; --border-teal:#b2dfdb; --bg-color:#f7f9fa; --text-dark:#2c3e50; --text-gray:#64748b; --white:#ffffff; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif; font-weight:700; -webkit-tap-highlight-color:transparent;}
    body { background:var(--bg-color); padding-bottom:50px; color:var(--text-dark); font-size:14px; }

    .header-3d { width:100%; background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.6) 100%),url('teacher2.png') center/cover no-repeat; padding:20px 12px 35px; text-align:center; position:relative; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
    .header-3d h1 { font-size:20px; font-weight:900; color:var(--white); margin-bottom:6px; text-shadow:0 2px 5px rgba(0,0,0,0.7); }
    .header-3d p.subtitle { font-size:12px; color:#e2e8f0; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,0.6); }
    .stepper { display:flex; justify-content:center; align-items:center; gap:10px; background:rgba(0,0,0,0.35); border-radius:50px; padding:6px 14px; margin:10px auto 0; width:fit-content; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.15); }
    .step { font-size:11px; font-weight:bold; color:var(--white); opacity:0.8; }
    .step.done { color:#22C55E; opacity:1; }
    .step.active { color:#a8f0e5; opacity:1; font-size:13px; }
    .step-divider { color:rgba(255,255,255,0.6); font-size:10px; }
    .back-btn-header { position:absolute; top:12px; right:12px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:900; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:5px; backdrop-filter:blur(6px); z-index:10; }
    .cloud-badge { position:absolute; top:12px; left:12px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:20px; font-size:10px; font-weight:900; display:flex; align-items:center; gap:5px; backdrop-filter:blur(6px); z-index:10; }
    .cloud-badge .dot { width:7px; height:7px; border-radius:50%; background:#22C55E; box-shadow:0 0 8px #22C55E; animation:pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    .main-container { width:100%; max-width:650px; margin:-15px auto 0; padding:0 10px; position:relative; z-index:10; }
    .progress-track { height:6px; background:rgba(0,0,0,0.08); border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--primary-teal),#38bdf8); border-radius:10px; width:0%; transition:width 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }

    /* ====== ANSWERS BOXES ====== */
    .answers-section { margin-bottom:16px; }
    .answers-label { font-size:12px; color:var(--text-gray); font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px; padding-right:4px; }
    .answers-label svg { width:14px; height:14px; color:var(--primary-teal); }
    .answers-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:6px; }
    .answer-box { position:relative; background:var(--white); border:2px dashed rgba(15,23,41,0.12); border-radius:12px; padding:10px 8px; min-height:62px; display:flex; flex-direction:column; justify-content:center; text-align:center; transition:all 0.4s; }
    .answer-box .box-question { font-size:9px; color:var(--text-gray); font-weight:800; margin-bottom:3px; }
    .answer-box .box-value { font-size:11.5px; color:var(--text-dark); font-weight:900; line-height:1.3; word-break:break-word; }
    .answer-box.filled { border-style:solid; border-color:var(--box-color,var(--primary-teal)); background:linear-gradient(145deg,#ffffff,#f8fafc); box-shadow:0 4px 15px rgba(15,23,41,0.08); animation:boxPop 0.5s; }
    .answer-box.filled .box-question { color:var(--box-color,var(--primary-teal)); }
    .answer-box.filled::before { content:'✓'; position:absolute; top:5px; left:6px; width:16px; height:16px; border-radius:50%; background:var(--box-color,var(--primary-teal)); color:#fff; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
    @keyframes boxPop { 0%{transform:scale(0.85);opacity:0.5;} 50%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }

    /* ====== QUESTION CARD ====== */
    .question-card { background:var(--white); border:1.5px solid #e2e8f0; border-radius:22px; padding:22px 18px; box-shadow:0 4px 20px rgba(15,23,41,0.06); animation:cardEntry 0.5s; position:relative; overflow:hidden; }
    .question-card::before { content:''; position:absolute; top:0; right:0; left:0; height:4px; background:linear-gradient(90deg,var(--primary-teal),#38bdf8,#a78bfa); }
    @keyframes cardEntry { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .question-number { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg,rgba(37,150,139,0.1),rgba(2,132,199,0.1)); color:var(--primary-teal); padding:5px 12px; border-radius:20px; font-size:11px; font-weight:900; margin-bottom:14px; border:1px solid rgba(37,150,139,0.2); }
    .question-title { font-size:18px; font-weight:900; color:var(--text-dark); margin-bottom:6px; }
    .question-subtitle { font-size:12px; color:var(--text-gray); font-weight:700; margin-bottom:18px; }

    /* ====== OPTIONS ====== */
    .options-list { display:flex; flex-direction:column; gap:10px; }
    .option-item { position:relative; background:#f8fafc; border:2px solid rgba(15,23,41,0.06); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all 0.3s; overflow:hidden; user-select:none; }
    .option-item:hover { background:#fff; border-color:var(--opt-color,var(--primary-teal)); transform:translateY(-2px); }
    .option-item.selected { background:linear-gradient(145deg,#fff,#f8fafc); border-color:var(--opt-color,var(--primary-teal)); box-shadow:0 6px 20px rgba(15,23,41,0.1); transform:translateY(-2px); }
    .option-radio { width:24px; height:24px; border-radius:50%; border:2.5px solid rgba(15,23,41,0.15); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff; }
    .option-radio::after { content:''; width:12px; height:12px; border-radius:50%; background:var(--opt-color,var(--primary-teal)); transform:scale(0); transition:transform 0.3s; }
    .option-item.selected .option-radio { border-color:var(--opt-color,var(--primary-teal)); }
    .option-item.selected .option-radio::after { transform:scale(1); }
    .option-content { flex:1; min-width:0; }
    .option-label { font-size:14.5px; font-weight:900; color:var(--text-dark); margin-bottom:2px; }
    .option-desc { font-size:11px; color:var(--text-gray); font-weight:700; }
    .option-icon { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--opt-bg,linear-gradient(135deg,#25968b,#1b736a)); color:#fff; flex-shrink:0; font-size:20px; transition:transform 0.3s; }
    .option-item.selected .option-icon { transform:scale(1.08) rotate(-5deg); }

    /* ====== TEXT INPUT QUESTION ====== */
    .text-input-box { padding:0; }
    .text-input-box .form-control { width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-top:3px solid #94a3b8; border-radius:14px; font-size:15px; background-color:#f1f5f9; font-family:inherit; font-weight:800; color:var(--text-dark); transition:all 0.3s; }
    .text-input-box .form-control:focus { border-color:var(--primary-teal); border-top-color:var(--primary-teal); outline:none; background-color:var(--white); box-shadow:0 8px 15px rgba(37,150,139,0.15); }

    /* ====== NUMBER INPUT ====== */
    .number-input-box { display:flex; align-items:center; gap:10px; justify-content:center; }
    .number-input-box input { width:120px; padding:14px; border:2px solid #e2e8f0; border-top:3px solid #94a3b8; border-radius:14px; font-size:20px; text-align:center; font-weight:900; color:var(--text-dark); background:#f1f5f9; font-family:inherit; }
    .number-input-box input:focus { border-color:var(--primary-teal); outline:none; background:#fff; }
    .num-btn { width:50px; height:50px; border-radius:50%; background:var(--primary-teal); color:#fff; border:none; font-size:22px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .num-btn:hover { background:var(--dark-teal); }

    /* ====== MAP QUESTION ====== */
    .map-box { padding:0; }
    .map-box #map-container { width:100%; height:220px; border-radius:14px; overflow:hidden; border:2px solid #e2e8f0; position:relative; margin-bottom:8px; z-index:1; }
    .map-box #map { width:100%; height:100%; }
    .btn-gps { background:var(--primary-teal); color:#fff; border:none; padding:12px 14px; border-radius:12px; font-weight:900; font-size:13px; cursor:pointer; font-family:inherit; width:100%; margin-bottom:8px; }
    .btn-gps:hover { background:var(--dark-teal); }
    .btn-gps:disabled { opacity:0.7; cursor:not-allowed; }
    #location-text { color:var(--text-gray); font-size:12px; font-weight:900; text-align:center; padding:8px; background:#f8fafc; border-radius:10px; margin-bottom:8px; border:1px solid #e2e8f0; }
    .detailed-address-box { background:linear-gradient(160deg,#FFFBEB 0%,#FEF3C7 100%); border:2px dashed #FCD34D; border-radius:12px; padding:10px; margin-top:8px; position:relative; }
    .detailed-address-box::before { content:'✨'; position:absolute; top:-10px; right:15px; background:#fff; padding:0 6px; font-size:14px; border-radius:50%; }
    .detailed-address-box .label-row { display:flex; align-items:center; gap:5px; margin-bottom:6px; font-size:12px; font-weight:900; color:#92400E; flex-wrap:wrap; }
    .detailed-address-box .label-row .badge { display:inline-flex; align-items:center; gap:3px; background:linear-gradient(135deg,#F59E0B,#D97706); color:#fff; padding:2px 7px; border-radius:6px; font-size:9px; font-weight:900; }
    .detailed-address-box .hint-text { font-size:10px; color:#92400E; margin-top:4px; font-weight:700; display:flex; align-items:center; gap:4px; opacity:0.85; }
    .detailed-address-box .form-control { background:#fff !important; border-color:#FCD34D !important; }

    /* ====== TIME QUESTION ====== */
    .time-box { padding:0; }
    .time-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .time-select { width:100%; padding:12px; border:2px solid #e2e8f0; border-top:3px solid #94a3b8; border-radius:12px; font-size:14px; font-family:inherit; outline:none; background:#f1f5f9; cursor:pointer; appearance:none; font-weight:800; color:var(--text-dark); padding-left:32px; background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2325968b' stroke-width='2.5'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:left 12px center; background-size:12px; }
    .time-select:focus { border-color:var(--primary-teal); background-color:#fff; }
    .duration-info { background:#f8fafc; border-right:4px solid var(--primary-teal); color:var(--dark-teal); padding:8px 12px; border-radius:8px; font-size:12px; font-weight:900; text-align:center; display:none; margin-bottom:10px; }
    .duration-info.show { display:block; }
    .repeat-option { background:var(--light-teal); border:1px solid var(--border-teal); border-radius:12px; padding:12px; display:flex; align-items:center; gap:8px; cursor:pointer; }
    .repeat-option input[type="checkbox"] { width:18px; height:18px; cursor:pointer; accent-color:var(--primary-teal); }
    .repeat-option label { font-size:13px; color:var(--dark-teal); font-weight:900; cursor:pointer; margin:0; }

    /* ====== CALENDAR QUESTION ====== */
    .calendar-box { padding:0; }
    .selected-day-banner { background:var(--light-teal); border:1px solid var(--border-teal); border-radius:10px; padding:8px 10px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
    .selected-day-banner .title { color:var(--dark-teal); font-size:13px; font-weight:900; }
    .selected-day-banner .day-badge { color:var(--white); background:var(--primary-teal); padding:3px 10px; border-radius:6px; font-size:12px; font-weight:900; }
    .calendar-header { position:relative; overflow:hidden; margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid #e2e8f0; display:flex; justify-content:center; align-items:center; }
    .title-track { display:flex; align-items:center; gap:8px; transition:transform 0.3s; }
    .month-name { color:var(--text-dark); font-size:17px; font-weight:900; }
    .month-number { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:var(--primary-teal); color:var(--white); font-size:13px; font-weight:900; }
    .year-text { color:var(--text-gray); font-size:15px; font-weight:800; }
    .month-appt-badge { display:inline-flex; align-items:center; gap:4px; background:#ef4444; color:var(--white); padding:3px 8px; border-radius:20px; font-size:11px; font-weight:900; }
    .month-appt-badge.zero { background:#94a3b8; }
    .week-wrapper { position:relative; overflow:hidden; border-radius:8px; border:2px solid #e2e8f0; background:var(--white); }
    .weekdays { display:grid; grid-template-columns:repeat(7,1fr); background:var(--primary-teal); }
    .weekdays div { text-align:center; font-weight:900; color:var(--white); padding:6px 2px; font-size:10px; border-left:1px solid rgba(255,255,255,0.2); }
    .weekdays div:last-child { border-left:none; }
    .days-wrapper { position:relative; overflow:hidden; background:#e2e8f0; padding-top:1px; touch-action:pan-y; }
    .days { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
    .days div.cell { background:var(--white); min-height:70px; padding:5px; display:flex; flex-direction:column; align-items:flex-start; color:var(--text-dark); font-size:12px; font-weight:900; cursor:pointer; position:relative; }
    .days div.cell.out-of-month { background:#f1f5f9 !important; color:#cbd5e1; }
    .days div.cell.past-cell { background:#f8fafc !important; cursor:not-allowed; opacity:0.6; }
    .cell .date-number { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-size:12px; }
    .cell.today-cell .date-number { background:var(--dark-teal); color:var(--white); }
    .cell.selected-cell { box-shadow:inset 0 0 0 3px var(--primary-teal); background:var(--light-teal) !important; }
    .badge { position:absolute; bottom:5px; left:5px; background:var(--primary-teal); color:var(--white); font-size:9px; font-weight:900; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; }
    .swipe-hint { text-align:center; font-size:11px; font-weight:800; color:var(--text-gray); margin-top:8px; }

    .slide-out-left { animation:slideOutLeft 0.3s forwards; }
    .slide-out-right { animation:slideOutRight 0.3s forwards; }
    .slide-in-right { animation:slideInRight 0.3s forwards; }
    .slide-in-left { animation:slideInLeft 0.3s forwards; }
    @keyframes slideOutLeft { to{transform:translateX(-100%);opacity:0;} }
    @keyframes slideOutRight { to{transform:translateX(100%);opacity:0;} }
    @keyframes slideInRight { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
    @keyframes slideInLeft { from{transform:translateX(-100%);opacity:0;} to{transform:translateX(0);opacity:1;} }

    /* ====== NAV BUTTONS ====== */
    .nav-buttons { display:flex; gap:10px; margin-top:20px; }
    .btn { flex:1; padding:15px 20px; border-radius:14px; border:none; font-family:'Cairo',sans-serif; font-size:14px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.3s; }
    .btn svg { width:18px; height:18px; }
    .btn-prev { background:#fff; color:var(--text-dark); border:1.5px solid #e2e8f0; flex:0 0 auto; }
    .btn-next { background:linear-gradient(135deg,var(--primary-teal),#0284c7); color:#fff; box-shadow:0 6px 20px rgba(37,150,139,0.35); }
    .btn-next:disabled { opacity:0.4; cursor:not-allowed; box-shadow:none; }
    .btn-finish { background:linear-gradient(135deg,#10B981,#047857); color:#fff; }
    .btn-add-another { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }

    /* ====== ERROR ====== */
    .error-msg { background:#fef2f2; color:#dc2626; border:2px solid #fecaca; border-radius:10px; padding:10px; font-size:12px; margin-bottom:10px; font-weight:900; display:none; }
    .error-msg.show { display:block; }

    /* ====== SUCCESS / SUMMARY SCREEN ====== */
    .success-screen { display:none; padding:20px; }
    .success-screen.show { display:block; animation:cardEntry 0.6s; }
    .success-icon { width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#10B981,#047857); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; box-shadow:0 10px 30px rgba(16,185,129,0.35); }
    .success-icon svg { width:45px; height:45px; color:#fff; stroke-width:3; }
    .success-title { font-size:22px; font-weight:900; color:var(--text-dark); margin-bottom:8px; text-align:center; }
    .success-desc { font-size:13px; color:var(--text-gray); font-weight:700; margin-bottom:24px; text-align:center; }

    .summary-section { background:var(--white); border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,0.08); padding:16px; border-top:4px solid var(--primary-teal); margin-top:16px; }
    .summary-section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid #f1f5f9; flex-wrap:wrap; gap:8px; }
    .summary-section-title { color:var(--dark-teal); font-size:16px; font-weight:900; }
    .summary-total-badge { background:var(--light-teal); color:var(--dark-teal); padding:4px 12px; border-radius:20px; font-size:12px; font-weight:900; border:1px solid var(--border-teal); }
    .appts-cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }

    .summary-card { background:var(--white); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.08); position:relative; border:2px solid #e2e8f0; }
    .summary-card.recurring-card { border-color:#8b5cf6; background:linear-gradient(180deg,#faf5ff 0%,#ffffff 30%); }
    .summary-card.normal-card { border-color:#3b82f6; background:linear-gradient(180deg,#eff6ff 0%,#ffffff 30%); }
    .summary-card.visible-card { border-color:#16a34a; }
    .summary-card.hidden-card { border-color:#dc2626; opacity:0.85; }
    .sc-top-strip { height:6px; width:100%; }
    .recurring-card .sc-top-strip { background:linear-gradient(90deg,#8b5cf6,#a78bfa); }
    .normal-card .sc-top-strip { background:linear-gradient(90deg,#3b82f6,#60a5fa); }
    .sc-status-row { display:flex; gap:5px; flex-wrap:wrap; padding:8px 12px 0; }
    .badge-status { font-size:10px; font-weight:900; padding:4px 8px; border-radius:20px; display:inline-flex; align-items:center; gap:3px; }
    .badge-status.online { background:#16a34a; color:#fff; }
    .badge-status.recurring { background:#8b5cf6; color:#fff; }
    .badge-status.one-time { background:#3b82f6; color:#fff; }
    .status-message { margin:0 12px 10px; padding:8px 12px; border-radius:8px; font-size:12px; font-weight:900; display:flex; align-items:center; gap:8px; }
    .status-message.visible-msg { background:linear-gradient(135deg,#dcfce7,#bbf7d0); color:#14532d; border:2px solid #16a34a; }
    .status-message.hidden-msg { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#7f1d1d; border:2px solid #dc2626; }
    .status-message .status-icon { font-size:18px; flex-shrink:0; }
    .status-message .status-text strong { display:block; font-size:13px; }
    .status-message .status-text small { font-size:10px; font-weight:700; opacity:0.85; }
    .sc-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:6px 12px 8px; }
    .sc-group-name { font-size:15px; font-weight:900; color:var(--text-dark); }
    .sc-teacher { font-size:11px; color:var(--text-gray); font-weight:800; margin-top:2px; }
    .sc-subject-block { background:linear-gradient(135deg,#fef3c7,#fde68a); border:2px solid #f59e0b; border-radius:8px; padding:8px 10px; margin:0 12px 8px; text-align:center; font-weight:900; color:#92400e; font-size:12px; }
    .sc-time-banner { background:linear-gradient(135deg,#1e293b,#334155); border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:900; margin:0 12px 10px; color:#fff; flex-wrap:wrap; gap:5px; }
    .sc-time-banner .duration-pill { background:#fbbf24; color:#78350f; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:900; }
    .sc-details-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#f8fafc; border-radius:8px; padding:8px; font-size:11px; margin:0 12px 10px; border:1px solid #e2e8f0; }
    .sc-detail-item { display:flex; align-items:center; gap:4px; color:var(--text-gray); font-weight:800; padding:5px 6px; background:#fff; border-radius:5px; border:1px solid #e2e8f0; }
    .sc-detail-item.full { grid-column:span 2; }
    .sc-detail-item .val { font-weight:900; color:var(--text-dark); }
    .sc-detail-item.address-item { background:#ecfdf5; border-color:#6ee7b7; color:#065f46; }
    .sc-detail-item.detailed-address-item { background:#fffbeb; border-color:#fcd34d; color:#92400e; }
    .sc-detail-item.center-item { background:#e0f2f0; border-color:#25968b; color:#1b736a; }
    .sc-mini-map-wrap { margin:0 12px 10px; border-radius:10px; overflow:hidden; border:2px solid var(--border-teal); background:#f1f5f9; }
    .sc-mini-map-title { background:linear-gradient(90deg,#e0f2f0,#b2dfdb); color:#1b736a; padding:5px 10px; font-size:11px; font-weight:900; border-bottom:1px solid var(--border-teal); }
    .sc-mini-map { width:100%; height:140px; background:#e8eef2; }
    .sc-footer-actions { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 12px; background:#f8fafc; border-top:2px solid #e2e8f0; flex-wrap:wrap; }
    .sc-actions-sub { display:flex; gap:5px; }
    .btn-action { display:flex; align-items:center; justify-content:center; gap:4px; font-size:10px; font-weight:900; padding:6px 10px; border-radius:8px; border:none; cursor:pointer; font-family:inherit; }
    .btn-edit { background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; }
    .btn-delete { background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; }
    .btn-visibility { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:900; padding:8px 12px; border-radius:8px; border:none; cursor:pointer; color:#fff; }
    .btn-visibility.hide-state { background:linear-gradient(135deg,#dc2626,#ef4444); }
    .btn-visibility.show-state { background:linear-gradient(135deg,#16a34a,#22c55e); }
    .empty-cards-state { text-align:center; padding:30px 16px; color:var(--text-gray); font-size:14px; font-weight:800; grid-column:1/-1; background:#f8fafc; border-radius:12px; border:2px dashed #cbd5e1; }

    .btn-add-new { width:100%; background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; border:none; padding:15px; border-radius:14px; font-size:15px; font-weight:900; cursor:pointer; margin-top:16px; box-shadow:0 6px 20px rgba(245,158,11,0.35); display:flex; align-items:center; justify-content:center; gap:8px; }

    .ripple { position:absolute; border-radius:50%; transform:scale(0); animation:rippleAnim 0.6s linear; background:rgba(37,150,139,0.15); pointer-events:none; z-index:5; }
    @keyframes rippleAnim { to{transform:scale(4);opacity:0;} }

    @media (max-width:480px) {
        .header-3d h1 { font-size:17px; }
        .answers-grid { grid-template-columns:repeat(auto-fill,minmax(85px,1fr)); gap:5px; }
        .answer-box { padding:8px 6px; min-height:56px; }
        .answer-box .box-value { font-size:10.5px; }
        .question-card { padding:18px 14px; }
        .question-title { font-size:16px; }
        .option-item { padding:12px 13px; gap:10px; }
        .option-icon { width:38px; height:38px; font-size:18px; }
        .sc-details-grid { grid-template-columns:1fr; }
        .sc-detail-item.full { grid-column:span 1; }
        .appts-cards-grid { grid-template-columns:1fr; }
        .sc-mini-map { height:120px; }
        .days div.cell { min-height:60px; font-size:10px; }
        .sc-footer-actions { flex-direction:column; }
        .btn-visibility { width:100%; }
    }
</style>
</head>
<body>

<header class="header-3d">
    <a href="mester3.html" class="back-btn-header"><span>🏠</span><span>الرئيسية</span></a>
    <div class="cloud-badge"><span class="dot"></span><span>محلي 💾</span></div>
    <h1>منصة احجزلي</h1>
    <p class="subtitle">بوابة المعلم - إعداد المواعيد والمجموعات</p>
    <div class="stepper">
        <div class="step done">✅ 1. التخصص</div>
        <div class="step-divider">❯</div>
        <div class="step active">2. المواعيد والمجموعات</div>
    </div>
</header>

<div class="main-container">
    <div class="progress-track"><div class="progress-fill" id="globalProgressFill"></div></div>

    <!-- ====== ANSWERS BOXES ====== -->
    <div class="answers-section">
        <div class="answers-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            <span>ملخص إعداد المجموعة</span>
        </div>
        <div class="answers-grid" id="answersGrid"></div>
    </div>

    <!-- ====== QUESTION CARD ====== -->
    <div id="questionContainer">
        <div class="question-card" id="questionCard"></div>
    </div>

    <!-- ====== SUCCESS SCREEN ====== -->
    <div class="success-screen" id="successScreen">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="success-title">تم حفظ المجموعة بنجاح! 🎉</div>
        <div class="success-desc">يمكنك إضافة مجموعة أخرى أو مراجعة مواعيدك</div>

        <div class="summary-section">
            <div class="summary-section-header">
                <div class="summary-section-title">📅 جدول المواعيد وملخص المجموعات</div>
                <span class="summary-total-badge" id="summaryTotalBadge">المواعيد المسجلة: 0</span>
            </div>
            <div class="appts-cards-grid" id="summaryCardsGrid"></div>
        </div>

        <button class="btn-add-new" onclick="addAnotherGroup()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            إضافة مجموعة جديدة
        </button>
    </div>
</div>

<script>
// ==========================================================
// ✅ SOUND
// ==========================================================
let audioCtx = null;
function getCtx(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); return audioCtx; }
function playClick(freq=1800,dur=0.035,vol=0.08){ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime; const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(freq,now); osc.frequency.exponentialRampToValueAtTime(freq*1.5,now+dur); const g=ctx.createGain(); g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol,now+0.004); g.gain.exponentialRampToValueAtTime(0.0001,now+dur); osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now+dur+0.02); }
function playNextSound(){ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime; [700,900,1200].forEach((f, i)=>{ const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(f,now+i*0.04); const g=ctx.createGain(); g.gain.setValueAtTime(0,now+i*0.04); g.gain.linearRampToValueAtTime(0.06,now+i*0.04+0.01); g.gain.exponentialRampToValueAtTime(0.001,now+i*0.04+0.09); osc.connect(g); g.connect(ctx.destination); osc.start(now+i*0.04); osc.stop(now+i*0.04+0.1); }); }
function playSuccessSound(){ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime; [523,659,784,1047].forEach((f, i)=>{ const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(f,now+i*0.12); const g=ctx.createGain(); g.gain.setValueAtTime(0,now+i*0.12); g.gain.linearRampToValueAtTime(0.09,now+i*0.12+0.02); g.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.25); osc.connect(g); g.connect(ctx.destination); osc.start(now+i*0.12); osc.stop(now+i*0.12+0.26); }); }
function createRipple(e,el){ const r=document.createElement('span'); const rect=el.getBoundingClientRect(); const size=Math.max(rect.width,rect.height); const cx=e.clientX||(e.touches?.[0]?.clientX??rect.left+rect.width/2); const cy=e.clientY||(e.touches?.[0]?.clientY??rect.top+rect.height/2); r.style.width=r.style.height=size+'px'; r.style.left=(cx-rect.left-size/2)+'px'; r.style.top=(cy-rect.top-size/2)+'px'; r.classList.add('ripple'); el.appendChild(r); setTimeout(()=>r.remove(),600); }

// ==========================================================
// ✅ HELPERS
// ==========================================================
const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const dayNames = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const STORAGE_KEY = 'mester2_appointments';

function formatTime(v){ if(!v) return ''; const [h,m]=v.split(':').map(Number); const h12=h===0?12:(h>12?h-12:h); const p=h<12?'ص':'م'; return `${h12}:${String(m).padStart(2,'0')} ${p}`; }
function calculateDuration(s,e){ if(!s||!e) return ''; const [sh,sm]=s.split(':').map(Number); const [eh,em]=e.split(':').map(Number); const diff=(eh*60+em)-(sh*60+sm); if(diff<=0) return ''; const h=Math.floor(diff/60), m=diff%60; let t=''; if(h>0) t+=`${h} س `; if(m>0) t+=`${m} د`; return t.trim(); }
function hexToRgba(hex,a=1){ if(!hex) return `rgba(37,150,139,${a})`; const h=hex.replace('#',''); return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${a})`; }

// ==========================================================
// ✅ LOAD APPOINTMENTS
// ==========================================================
let appointments = [];
try { appointments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ appointments = []; }
function saveAppointments(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments)); } catch(e){} }

// ==========================================================
// ✅ QUESTIONS
// ==========================================================
const QUESTIONS = [
    { id:'location', type:'options', title:'مكان الدرس', subtitle:'اختر مكان إقامة الحصة',
      options: [
          { value:'السنتر', label:'السنتر', desc:'في مركز تعليمي', icon:'🏫', color:'#25968b' },
          { value:'بيت المستر', label:'بيت المستر', desc:'في منزل المعلم', icon:'🏠', color:'#7c3aed' },
          { value:'منزل الطالب', label:'منزل الطالب', desc:'في منزل الطالب', icon:'🚗', color:'#ea580c' }
      ]
    },
    { id:'centerName', type:'text', title:'اسم السنتر', subtitle:'اكتب اسم السنتر التعليمي',
      dependsOn: { id:'location', value:'السنتر' }, placeholder:'مثال: سنتر النخبة التعليمي' },
    { id:'gender', type:'options', title:'الفئات المسموح بها', subtitle:'من يمكنه الحضور لهذه المجموعة؟',
      options: [
          { value:'مختلط', label:'مختلط', desc:'أولاد وبنات', icon:'👫', color:'#25968b' },
          { value:'أولاد فقط', label:'أولاد فقط', desc:'مجموعة ذكور', icon:'👨‍🎓', color:'#0284c7' },
          { value:'بنات فقط', label:'بنات فقط', desc:'مجموعة إناث', icon:'👩‍🎓', color:'#db2777' }
      ]
    },
    { id:'teacherName', type:'text', title:'اسم المستر', subtitle:'اكتب اسمك الكامل أو اسمك المهني', placeholder:'مثال: مستر أحمد' },
    { id:'groupName', type:'text', title:'اسم المجموعة الطلابية', subtitle:'اكتب اسم مميز للمجموعة', placeholder:'مثال: مجموعة النخبة - السبت' },
    { id:'studentsCount', type:'number', title:'العدد المطلوب (السعة)', subtitle:'كم طالب تستقبل في هذه المجموعة؟', min:1, max:100, defaultValue:20 },
    { id:'location_details', type:'map', title:'الموقع الجغرافي', subtitle:'حدد موقع الدرس على الخريطة' },
    { id:'time', type:'time', title:'توقيت الحصة', subtitle:'اختر وقت البداية والنهاية' },
    { id:'date', type:'calendar', title:'حدد يوم الحصة', subtitle:'اختر اليوم من التقويم' }
];

let currentIndex = 0;
let answers = {
    location: '', centerName: '', gender: '', teacherName: '', groupName: '',
    studentsCount: 20, lat: null, lng: null, street: '', detailedAddress: '',
    startTime: '', endTime: '', repeatWeekly: false, date: '', dayName: ''
};

// ==========================================================
// ✅ ANSWERS BOXES
// ==========================================================
function renderAnswerBoxes() {
    const grid = document.getElementById('answersGrid');
    grid.innerHTML = '';
    const boxes = [
        { id:'location', label:'المكان', value:answers.location },
        { id:'gender', label:'الفئة', value:answers.gender },
        { id:'teacherName', label:'المستر', value:answers.teacherName },
        { id:'groupName', label:'المجموعة', value:answers.groupName },
        { id:'studentsCount', label:'العدد', value:answers.studentsCount ? answers.studentsCount+' طالب' : '' },
        { id:'time', label:'الوقت', value:answers.startTime && answers.endTime ? formatTime(answers.startTime)+' → '+formatTime(answers.endTime) : '' },
        { id:'date', label:'اليوم', value:answers.date ? answers.dayName+' '+answers.date : '' }
    ];
    if(answers.centerName) boxes.splice(1, 0, { id:'centerName', label:'السنتر', value:answers.centerName });

    boxes.forEach(box => {
        const el = document.createElement('div');
        el.className = 'answer-box';
        if(box.value){ el.classList.add('filled'); el.style.setProperty('--box-color', '#25968b'); }
        el.innerHTML = `<div class="box-question">${box.label}</div><div class="box-value">${box.value||'—'}</div>`;
        grid.appendChild(el);
    });
}

// ==========================================================
// ✅ CHECK IF QUESTION SHOULD SHOW
// ==========================================================
function shouldShowQuestion(q) {
    if(!q.dependsOn) return true;
    return answers[q.dependsOn.id] === q.dependsOn.value;
}

function getVisibleQuestions() {
    return QUESTIONS.filter(q => shouldShowQuestion(q));
}

// ==========================================================
// ✅ RENDER QUESTION
// ==========================================================
function renderQuestion() {
    const card = document.getElementById('questionCard');
    const visible = getVisibleQuestions();
    if(currentIndex >= visible.length) currentIndex = visible.length - 1;
    const q = visible[currentIndex];

    document.getElementById('globalProgressFill').style.width = (((currentIndex+1)/visible.length)*100)+'%';

    let contentHTML = '';
    let hasAnswer = false;

    if(q.type === 'options'){
        hasAnswer = !!answers[q.id];
        contentHTML = `<div class="options-list">${q.options.map(opt => {
            const isSel = answers[q.id] === opt.value;
            return `<div class="option-item ${isSel?'selected':''}" data-value="${opt.value}" style="--opt-color:${opt.color};--opt-bg:linear-gradient(135deg,${opt.color},${opt.color}dd);">
                <div class="option-radio"></div>
                <div class="option-content"><div class="option-label">${opt.label}</div><div class="option-desc">${opt.desc}</div></div>
                <div class="option-icon">${opt.icon}</div>
            </div>`;
        }).join('')}</div>`;
    }
    else if(q.type === 'text'){
        hasAnswer = !!answers[q.id] && answers[q.id].trim().length > 0;
        contentHTML = `<div class="text-input-box"><input type="text" id="textInput" class="form-control" placeholder="${q.placeholder||''}" value="${answers[q.id]||''}"></div>`;
    }
    else if(q.type === 'number'){
        hasAnswer = !!answers[q.id] && answers[q.id] >= (q.min||1);
        contentHTML = `<div class="number-input-box">
            <button class="num-btn" onclick="changeNumber(-1)">−</button>
            <input type="number" id="numberInput" value="${answers[q.id]||q.defaultValue||20}" min="${q.min||1}" max="${q.max||100}">
            <button class="num-btn" onclick="changeNumber(1)">+</button>
        </div>`;
    }
    else if(q.type === 'map'){
        hasAnswer = !!(answers.lat && answers.lng);
        contentHTML = `<div class="map-box">
            <div id="map-container"><div id="map"></div></div>
            <button class="btn-gps" id="custom-gps-btn" type="button" onclick="getLocation(event)">📍 تحديد موقعي بدقة الآن</button>
            <div id="location-text">${answers.street ? '📍 '+answers.street : 'يرجى تحديد الموقع من الخريطة'}</div>
            <div class="detailed-address-box">
                <div class="label-row"><span>🏠</span><span>العنوان التفصيلي</span><span class="badge">✨ اختياري</span></div>
                <input type="text" id="detailed-address" class="form-control" placeholder="مثال: أمام مسجد النور - الدور الثاني - شقة 5" value="${answers.detailedAddress||''}">
                <div class="hint-text"><span>💡</span><span>اكتب تفاصيل تساعد الطالب في الوصول</span></div>
            </div>
        </div>`;
    }
    else if(q.type === 'time'){
        hasAnswer = !!(answers.startTime && answers.endTime);
        contentHTML = `<div class="time-box">
            <div class="time-row">
                <div><label style="font-size:12px;margin-bottom:4px;display:block;color:var(--text-gray);">من الساعة</label><select id="startTimeSel" class="time-select" onchange="onStartTimeChange()"></select></div>
                <div><label style="font-size:12px;margin-bottom:4px;display:block;color:var(--text-gray);">إلى الساعة</label><select id="endTimeSel" class="time-select" onchange="onEndTimeChange()"></select></div>
            </div>
            <div class="duration-info" id="durationInfo"></div>
            <div class="repeat-option">
                <input type="checkbox" id="repeatWeekly" ${answers.repeatWeekly?'checked':''} onchange="answers.repeatWeekly=this.checked">
                <label for="repeatWeekly">تكرار أسبوعي كل <span id="repeatDayName">${answers.dayName||'...'}</span></label>
            </div>
        </div>`;
    }
    else if(q.type === 'calendar'){
        hasAnswer = !!answers.date;
        contentHTML = `<div class="calendar-box">
            <div class="selected-day-banner">
                <span class="title">📅 اليوم المحدد</span>
                <span class="day-badge" id="selectedDayLabel">${answers.date ? answers.dayName+' '+answers.date : 'لم يتم التحديد'}</span>
            </div>
            <div class="calendar-header">
                <div class="title-track" id="titleTrack">
                    <span class="month-number" id="monthNumber">1</span>
                    <span class="month-name" id="monthName">يناير</span>
                    <span class="year-text" id="yearText">2026</span>
                    <span class="month-appt-badge" id="monthApptBadge"><span id="monthApptCount">0</span></span>
                </div>
            </div>
            <div class="week-wrapper">
                <div class="weekdays"><div>السبت</div><div>الأحد</div><div>الاثنين</div><div>الثلاثاء</div><div>الأربعاء</div><div>الخميس</div><div class="friday">الجمعة</div></div>
                <div class="days-wrapper" id="daysWrapper"><div class="days" id="days"></div></div>
            </div>
            <div class="swipe-hint">👈 اسحب يميناً أو يساراً لتغيير الشهر 👉</div>
        </div>`;
    }

    const isLast = currentIndex === visible.length - 1;

    card.innerHTML = `
        <div class="question-number">السؤال ${currentIndex+1} من ${visible.length}</div>
        <div class="question-title">${q.title}</div>
        <div class="question-subtitle">${q.subtitle}</div>
        <div class="error-msg" id="addErrorMsg"></div>
        ${contentHTML}
        <div class="nav-buttons">
            ${currentIndex > 0 ? `<button class="btn btn-prev" onclick="prevQuestion()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> السابق</button>` : ''}
            <button class="btn ${isLast?'btn-finish':'btn-next'}" id="nextBtn" ${!hasAnswer?'disabled':''} onclick="${isLast?'finishQuiz()':'nextQuestion()'}">
                ${isLast?'حفظ المجموعة':'التالي'}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
        </div>
    `;

    // Attach events
    if(q.type === 'options'){
        document.querySelectorAll('.option-item').forEach(item => {
            item.addEventListener('click', (e) => selectOption(item, q, e));
            item.addEventListener('touchstart', (e) => createRipple(e, item), { passive:true });
        });
    }
    else if(q.type === 'text'){
        const inp = document.getElementById('textInput');
        inp.addEventListener('input', () => {
            answers[q.id] = inp.value;
            updateNextBtn();
            renderAnswerBoxes();
        });
        setTimeout(() => inp.focus(), 100);
    }
    else if(q.type === 'number'){
        const inp = document.getElementById('numberInput');
        inp.addEventListener('input', () => { answers[q.id] = parseInt(inp.value)||0; updateNextBtn(); renderAnswerBoxes(); });
    }
    else if(q.type === 'map'){
        setTimeout(() => { if(!window._mapInited){ initMap(); window._mapInited = true; } }, 150);
    }
    else if(q.type === 'time'){
        populateTimeSelects();
        const dAddr = document.getElementById('detailed-address');
        if(dAddr) dAddr.addEventListener('input', () => { answers.detailedAddress = dAddr.value; });
    }
    else if(q.type === 'calendar'){
        setTimeout(() => { renderCalendar(); setupSwipeCal(); }, 100);
    }
}

function updateNextBtn(){
    const visible = getVisibleQuestions();
    const q = visible[currentIndex];
    const nextBtn = document.getElementById('nextBtn');
    if(!nextBtn) return;
    let has = false;
    if(q.type === 'text') has = !!answers[q.id] && answers[q.id].trim().length > 0;
    else if(q.type === 'number') has = !!answers[q.id] && answers[q.id] >= 1;
    else if(q.type === 'options') has = !!answers[q.id];
    nextBtn.disabled = !has;
}

function changeNumber(delta){
    const visible = getVisibleQuestions();
    const q = visible[currentIndex];
    const inp = document.getElementById('numberInput');
    let v = (parseInt(inp.value)||20) + delta;
    if(v < (q.min||1)) v = q.min||1;
    if(v > (q.max||100)) v = q.max||100;
    inp.value = v;
    answers[q.id] = v;
    updateNextBtn();
    renderAnswerBoxes();
    playClick(1500, 0.04, 0.08);
}

function selectOption(item, question, e) {
    createRipple(e, item);
    playClick(1700, 0.04, 0.09);
    if(navigator.vibrate) navigator.vibrate(20);
    const value = item.dataset.value;
    answers[question.id] = value;

    // لو غيّر المكان، مسح اسم السنتر لو مش سنتر
    if(question.id === 'location' && value !== 'السنتر') answers.centerName = '';

    document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
    item.classList.add('selected');

    renderAnswerBoxes();
    updateNextBtn();
}

// ==========================================================
// ✅ NAVIGATION
// ==========================================================
function nextQuestion() {
    playNextSound();
    if(navigator.vibrate) navigator.vibrate(25);
    const visible = getVisibleQuestions();
    if(currentIndex < visible.length - 1){
        currentIndex++;
        renderQuestion();
        renderAnswerBoxes();
        window.scrollTo({top:0,behavior:'smooth'});
    }
}

function prevQuestion() {
    playClick(1500, 0.04, 0.09);
    if(navigator.vibrate) navigator.vibrate(15);
    if(currentIndex > 0){
        currentIndex--;
        renderQuestion();
        renderAnswerBoxes();
        window.scrollTo({top:0,behavior:'smooth'});
    }
}

// ==========================================================
// ✅ TIME SLOTS
// ==========================================================
const TIME_SLOTS = [];
for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=30){
        const h12 = h===0?12:(h>12?h-12:h);
        const p = h<12?'ص':'م';
        const mm = String(m).padStart(2,'0');
        TIME_SLOTS.push({ value:`${String(h).padStart(2,'0')}:${mm}`, label:`${h12}:${mm} ${p}` });
    }
}

function populateTimeSelects(){
    const startSel = document.getElementById('startTimeSel');
    const endSel = document.getElementById('endTimeSel');
    if(!startSel || !endSel) return;
    let html = '<option value="">-- اختر --</option>';
    TIME_SLOTS.forEach(s => { html += `<option value="${s.value}">${s.label}</option>`; });
    startSel.innerHTML = html;
    endSel.innerHTML = html;
    if(answers.startTime) startSel.value = answers.startTime;
    if(answers.endTime) endSel.value = answers.endTime;
    updateDuration();
}

function onStartTimeChange(){
    const sv = document.getElementById('startTimeSel').value;
    const endSel = document.getElementById('endTimeSel');
    answers.startTime = sv;
    let html = '<option value="">-- اختر --</option>';
    TIME_SLOTS.forEach(s => { if(!sv || s.value > sv) html += `<option value="${s.value}">${s.label}</option>`; });
    endSel.innerHTML = html;
    if(answers.endTime && answers.endTime > sv && endSel.querySelector(`option[value="${answers.endTime}"]`)) endSel.value = answers.endTime;
    else { answers.endTime = ''; endSel.value = ''; }
    updateDuration();
    updateNextBtn();
    renderAnswerBoxes();
}

function onEndTimeChange(){
    const ev = document.getElementById('endTimeSel').value;
    answers.endTime = ev;
    updateDuration();
    updateNextBtn();
    renderAnswerBoxes();
}

function updateDuration(){
    const info = document.getElementById('durationInfo');
    if(!info) return;
    if(!answers.startTime || !answers.endTime){ info.classList.remove('show'); return; }
    const dur = calculateDuration(answers.startTime, answers.endTime);
    if(!dur){ info.classList.remove('show'); return; }
    info.textContent = '⏱ المدة: ' + dur;
    info.classList.add('show');
}

// ==========================================================
// ✅ MAP
// ==========================================================
let map, marker;

function initMap(){
    if(!document.getElementById('map')) return;
    if(window._leafletMap){ try { window._leafletMap.remove(); } catch(e){} }
    map = L.map('map').setView(answers.lat && answers.lng ? [answers.lat, answers.lng] : [26.8206, 30.8025], answers.lat ? 15 : 5.5);
    window._leafletMap = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OSM' }).addTo(map);
    marker = L.marker(answers.lat && answers.lng ? [answers.lat, answers.lng] : [26.8206, 30.8025], { draggable:true }).addTo(map);
    map.on('click', e => { marker.setLatLng([e.latlng.lat, e.latlng.lng]); updateLocationInput(e.latlng.lat, e.latlng.lng, true); });
    marker.on('dragend', () => { const p = marker.getLatLng(); updateLocationInput(p.lat, p.lng, true); });
    setTimeout(() => { try { map.invalidateSize(); } catch(e){} }, 200);
}

async function getStreetName(lat,lng){
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ar`);
        const data = await res.json();
        if(data && data.address){
            const road = data.address.road || data.address.pedestrian || '';
            const nb = data.address.neighbourhood || data.address.suburb || '';
            const city = data.address.city || data.address.town || data.address.village || '';
            const parts = [road, nb, city].filter(Boolean);
            return parts.length ? parts.join('، ') : (data.display_name.split(',').slice(0,3).join('، '));
        }
    } catch(e){}
    return '';
}

async function updateLocationInput(lat,lng,showPopup=false){
    answers.lat = lat; answers.lng = lng;
    const txt = document.getElementById('location-text');
    if(txt) { txt.textContent = '⏳ جاري تحديد اسم الشارع...'; }
    const street = await getStreetName(lat,lng);
    answers.street = street || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    if(txt) txt.textContent = street ? '📍 '+street : `📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    updateNextBtn();
    renderAnswerBoxes();
    if(showPopup) marker.bindPopup(`<div style='text-align:center;font-family:Cairo;font-weight:900;color:#1b736a;font-size:12px;'>${answers.street}</div>`).openPopup();
}

window.getLocation = function(e){
    if(e) e.preventDefault();
    const btn = document.getElementById('custom-gps-btn');
    if(!btn) return;
    btn.disabled = true; btn.textContent = '⏳ جاري التحديد...';
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
            pos => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                marker.setLatLng([lat,lng]);
                map.flyTo([lat,lng], 17, { animate:true, duration:1.2 });
                updateLocationInput(lat, lng, true);
                btn.disabled = false; btn.textContent = '✅ تم التحديد';
                playClick(1400, 0.06, 0.13);
            },
            err => { btn.disabled = false; btn.textContent = '❌ فشل - حاول مرة أخرى'; },
            { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
        );
    } else { btn.disabled = false; btn.textContent = '❌ غير مدعوم'; }
};

// ==========================================================
// ✅ CALENDAR
// ==========================================================
let currentDate = new Date();
let isAnimating = false;

function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function getDisplayIndex(jsDay){ return (jsDay+1)%7; }

function getMonthAppointmentsCount(y,m){
    let total = 0;
    const days = new Date(y,m+1,0).getDate();
    for(let d=1; d<=days; d++){
        const key = dateKey(y,m,d);
        total += appointments.filter(a => a.date === key).length;
    }
    return total;
}

function renderCalendar(){
    if(!document.getElementById('days')) return;
    const y = currentDate.getFullYear(), m = currentDate.getMonth();
    document.getElementById('monthNumber').textContent = m+1;
    document.getElementById('monthName').textContent = monthNames[m];
    document.getElementById('yearText').textContent = y;
    const cnt = getMonthAppointmentsCount(y,m);
    document.getElementById('monthApptCount').textContent = cnt;
    const badge = document.getElementById('monthApptBadge');
    if(cnt === 0) badge.classList.add('zero'); else badge.classList.remove('zero');

    const firstDayJs = new Date(y,m,1).getDay();
    const firstDayIndex = getDisplayIndex(firstDayJs);
    const daysInMonth = new Date(y,m+1,0).getDate();
    const daysInPrevMonth = new Date(y,m,0).getDate();
    const container = document.getElementById('days');
    container.innerHTML = '';

    const today = new Date(); today.setHours(0,0,0,0);
    const totalCells = Math.ceil((firstDayIndex + daysInMonth)/7)*7;

    for(let i=0; i<totalCells; i++){
        const dayEl = document.createElement('div');
        dayEl.classList.add('cell');
        let cd, cy=y, cm=m;
        if(i < firstDayIndex){ cd = daysInPrevMonth - firstDayIndex + i + 1; cm = m-1; if(cm<0){cm=11;cy--;} dayEl.classList.add('out-of-month'); }
        else if(i < firstDayIndex + daysInMonth){ cd = i - firstDayIndex + 1; }
        else { cd = i - firstDayIndex - daysInMonth + 1; cm = m+1; if(cm>11){cm=0;cy++;} dayEl.classList.add('out-of-month'); }

        const dn = document.createElement('span');
        dn.classList.add('date-number');
        dn.textContent = cd;
        dayEl.appendChild(dn);

        const dt = new Date(cy,cm,cd);
        dt.setHours(0,0,0,0);
        if(dt.getTime() === today.getTime()) dayEl.classList.add('today-cell');

        const key = dateKey(cy,cm,cd);
        const dayAppts = appointments.filter(a => a.date === key);
        if(dayAppts.length > 0){
            const b = document.createElement('span');
            b.classList.add('badge');
            b.textContent = dayAppts.length;
            dayEl.appendChild(b);
        }

        if(dt.getTime() < today.getTime()){
            dayEl.classList.add('past-cell');
        } else {
            if(answers.date === key) dayEl.classList.add('selected-cell');
            dayEl.onclick = () => selectDay(cy,cm,cd);
        }
        container.appendChild(dayEl);
    }
}

function selectDay(y,m,d){
    answers.date = dateKey(y,m,d);
    answers.dayName = dayNames[new Date(y,m,d).getDay()];
    playClick(1800, 0.04, 0.1);
    if(navigator.vibrate) navigator.vibrate(15);
    renderCalendar();
    renderAnswerBoxes();
    updateNextBtn();
    const lbl = document.getElementById('selectedDayLabel');
    if(lbl) lbl.textContent = answers.dayName + ' ' + answers.date;
    const repDay = document.getElementById('repeatDayName');
    if(repDay) repDay.textContent = answers.dayName;
}

window.changeMonthDir = function(direction){
    if(isAnimating) return;
    isAnimating = true;
    const t = document.getElementById('titleTrack');
    const dw = document.getElementById('days');
    if(!t || !dw) return;
    const outC = direction>0 ? 'slide-out-left' : 'slide-out-right';
    const inC = direction>0 ? 'slide-in-right' : 'slide-in-left';
    t.classList.add(outC); dw.classList.add(outC);
    setTimeout(() => {
        currentDate.setDate(1);
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
        t.classList.remove(outC); dw.classList.remove(outC);
        t.classList.add(inC); dw.classList.add(inC);
        setTimeout(() => { t.classList.remove(inC); dw.classList.remove(inC); isAnimating = false; }, 300);
    }, 300);
};

function setupSwipeCal(){
    const wrap = document.getElementById('daysWrapper');
    if(!wrap || wrap._swipeAttached) return;
    wrap._swipeAttached = true;
    let sx=0, sy=0, sw=false;
    wrap.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; sw = true; }, { passive:true });
    wrap.addEventListener('touchend', e => {
        if(!sw) return; sw = false;
        const dx = e.changedTouches[0].screenX - sx;
        const dy = e.changedTouches[0].screenY - sy;
        if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 60) return;
        if(Math.abs(dx) > 40){ if(dx > 0) window.changeMonthDir(-1); else window.changeMonthDir(1); }
    }, { passive:true });
}

// ==========================================================
// ✅ FINISH QUIZ - حفظ المجموعة
// ==========================================================
function finishQuiz(){
    playSuccessSound();
    if(navigator.vibrate) navigator.vibrate([30,50,30]);

    // جمع المادة والصف من mester1
    const savedData = JSON.parse(localStorage.getItem('teacherSelections') || '{}');
    let subject = '', grade = '';
    for(const sid in savedData){
        const s = savedData[sid];
        if(s.subjects && s.subjects.length > 0){
            subject = s.subjects.join(' - ');
            grade = s.grade;
            break;
        }
    }

    const newAppt = {
        id: 'local_' + Date.now(),
        teacherName: answers.teacherName,
        centerName: answers.centerName,
        subject, grade,
        groupName: answers.groupName,
        maxCapacity: answers.studentsCount,
        genderAllowed: answers.gender,
        location: answers.location,
        street: answers.street,
        detailedAddress: answers.detailedAddress,
        fullAddress: [answers.street, answers.detailedAddress].filter(Boolean).join(' - '),
        lat: answers.lat, lng: answers.lng,
        startTime: answers.startTime, endTime: answers.endTime,
        dayName: answers.dayName,
        date: answers.date,
        apptType: answers.repeatWeekly ? 'recurring' : 'normal',
        isActive: true,
        createdAt: Date.now()
    };

    appointments.push(newAppt);
    saveAppointments();

    document.getElementById('questionContainer').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');
    document.getElementById('globalProgressFill').style.width = '100%';

    renderCards();
}

function addAnotherGroup(){
    // إعادة تعيين
    currentIndex = 0;
    answers = {
        location: '', centerName: '', gender: '', teacherName: answers.teacherName,
        groupName: '', studentsCount: 20, lat: null, lng: null,
        street: '', detailedAddress: '', startTime: '', endTime: '',
        repeatWeekly: false, date: '', dayName: ''
    };
    window._mapInited = false;
    window._leafletMap = null;

    document.getElementById('successScreen').classList.remove('show');
    document.getElementById('questionContainer').style.display = 'block';
    document.getElementById('globalProgressFill').style.width = '0%';

    renderAnswerBoxes();
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
    playNextSound();
}

// ==========================================================
// ✅ CARDS
// ==========================================================
function initMiniMap(el,lat,lng){
    if(!el || !window.L) return;
    try {
        const mm = L.map(el, { zoomControl:false, attributionControl:false, scrollWheelZoom:false, dragging:false, doubleClickZoom:false, boxZoom:false, keyboard:false, tap:false, touchZoom:false }).setView([lat,lng],15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mm);
        const icon = L.divIcon({ html:`<div style="background:#25968b;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;">📍</div>`, iconSize:[26,26], iconAnchor:[13,26] });
        L.marker([lat,lng], { icon }).addTo(mm);
        setTimeout(() => { try { mm.invalidateSize(); } catch(e){} }, 200);
        mm.on('click', () => window.open(`https://www.google.com/maps?q=${lat},${lng}`,'_blank'));
        el.style.cursor = 'pointer';
        window._miniMaps = window._miniMaps || [];
        window._miniMaps.push(mm);
    } catch(e){}
}

function renderCards(){
    const grid = document.getElementById('summaryCardsGrid');
    const badge = document.getElementById('summaryTotalBadge');
    if(!grid) return;

    if(window._miniMaps?.length) window._miniMaps.forEach(m => { try { m.remove(); } catch(e){} });
    window._miniMaps = [];
    grid.innerHTML = '';

    badge.textContent = `المواعيد المسجلة: ${appointments.length}`;

    if(appointments.length === 0){
        grid.innerHTML = `<div class="empty-cards-state">لا توجد مجموعات بعد</div>`;
        return;
    }

    appointments.forEach(item => {
        const card = document.createElement('div');
        const isRec = item.apptType === 'recurring';
        const isVisible = item.isActive !== false;
        card.classList.add('summary-card');
        card.classList.add(isRec ? 'recurring-card' : 'normal-card');
        card.classList.add(isVisible ? 'visible-card' : 'hidden-card');

        const dur = calculateDuration(item.startTime, item.endTime);
        const durBadge = dur ? `<span class="duration-pill">⏱ ${dur}</span>` : '';
        let locIcon = '🏫';
        if(item.location === 'بيت المستر') locIcon = '🏠';
        if(item.location === 'منزل الطالب') locIcon = '🚗';
        let genderIcon = '👫';
        if(item.genderAllowed === 'أولاد فقط') genderIcon = '👨‍🎓';
        if(item.genderAllowed === 'بنات فقط') genderIcon = '👩‍🎓';

        const typeBadge = isRec ? '<span class="badge-status recurring">🔁 أسبوعي</span>' : '<span class="badge-status one-time">📅 محدد</span>';
        let addressHtml = '';
        if(item.street) addressHtml += `<div class="sc-detail-item full address-item"><span>📍</span><span class="val">${item.street}</span></div>`;
        if(item.detailedAddress) addressHtml += `<div class="sc-detail-item full detailed-address-item"><span>🏠</span><span class="val">${item.detailedAddress}</span></div>`;
        const centerHtml = item.centerName ? `<div class="sc-detail-item full center-item"><span>🏫</span><span class="val">${item.centerName}</span></div>` : '';
        const statusHtml = isVisible
            ? `<div class="status-message visible-msg"><span class="status-icon">👁️</span><div class="status-text"><strong>ظاهر للطلبة</strong></div></div>`
            : `<div class="status-message hidden-msg"><span class="status-icon">🙈</span><div class="status-text"><strong>مخفي</strong></div></div>`;
        const hasLoc = item.lat && item.lng;
        const miniMapHtml = hasLoc ? `<div class="sc-mini-map-wrap"><div class="sc-mini-map-title">🗺️ موقع الدرس</div><div class="sc-mini-map" data-lat="${item.lat}" data-lng="${item.lng}"></div></div>` : '';

        card.innerHTML = `
            <div class="sc-top-strip"></div>
            <div class="sc-status-row"><span class="badge-status online">✅ محفوظ</span>${typeBadge}</div>
            <div class="sc-header"><div style="flex:1;"><div class="sc-group-name">${item.groupName}</div><div class="sc-teacher">👤 ${item.teacherName}</div></div></div>
            ${statusHtml}
            <div class="sc-subject-block">📚 ${item.grade} | ${item.subject}</div>
            <div class="sc-time-banner"><span>🕐 ${formatTime(item.startTime)} → ${formatTime(item.endTime)}</span>${durBadge}</div>
            <div class="sc-details-grid">
                ${centerHtml}${addressHtml}
                <div class="sc-detail-item"><span>📅</span><span class="val">${item.dayName}</span></div>
                <div class="sc-detail-item"><span>🗓</span><span class="val">${item.date}</span></div>
                <div class="sc-detail-item"><span>${locIcon}</span><span class="val">${item.location}</span></div>
                <div class="sc-detail-item"><span>${genderIcon}</span><span class="val">${item.genderAllowed}</span></div>
                <div class="sc-detail-item"><span>👥</span><span class="val">${item.maxCapacity} طالب</span></div>
            </div>
            ${miniMapHtml}
            <div class="sc-footer-actions">
                <div class="sc-actions-sub">
                    <button class="btn-action btn-delete" onclick="deleteAppointment('${item.id}')">🗑 حذف</button>
                </div>
                <button class="btn-visibility ${isVisible ? 'hide-state' : 'show-state'}" onclick="toggleVisibility('${item.id}')">${isVisible ? '🙈 إخفاء' : '👁️ إظهار'}</button>
            </div>
        `;
        grid.appendChild(card);

        if(hasLoc){
            const el = card.querySelector('.sc-mini-map');
            if(el) setTimeout(() => initMiniMap(el, parseFloat(item.lat), parseFloat(item.lng)), 100);
        }
    });
}

window.deleteAppointment = function(id){
    if(!confirm('هل أنت متأكد من الحذف؟')) return;
    appointments = appointments.filter(a => a.id !== id);
    saveAppointments();
    renderCards();
    playClick(600, 0.08, 0.1);
};

window.toggleVisibility = function(id){
    const it = appointments.find(a => a.id === id);
    if(!it) return;
    it.isActive = !it.isActive;
    saveAppointments();
    renderCards();
    playClick(1200, 0.05, 0.1);
};

renderAnswerBoxes();
renderQuestion();

document.addEventListener('touchstart', () => getCtx(), { once:true, passive:true });
document.addEventListener('click', () => getCtx(), { once:true, passive:true });
