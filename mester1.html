<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>منصة احجزلي - إعداد التخصص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root { --primary-teal:#25968b; --dark-teal:#1b736a; --light-teal:#e0f2f0; --border-teal:#b2dfdb; --bg-color:#f7f9fa; --text-dark:#2c3e50; --text-gray:#64748b; --white:#ffffff; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif; font-weight:700; -webkit-tap-highlight-color:transparent;}
    body { background:var(--bg-color); padding-bottom:50px; color:var(--text-dark); font-size:14px; }
    .header-3d { width:100%; background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.6) 100%),url('teacher2.png') center/cover no-repeat; padding:20px 12px 35px; text-align:center; position:relative; box-shadow:0 4px 15px rgba(0,0,0,0.15); }
    .header-3d h1 { font-size:20px; font-weight:900; color:var(--white); margin-bottom:6px; text-shadow:0 2px 5px rgba(0,0,0,0.7); }
    .header-3d p.subtitle { font-size:12px; color:#e2e8f0; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,0.6); }
    .stepper { display:flex; justify-content:center; align-items:center; gap:10px; background:rgba(0,0,0,0.35); border-radius:50px; padding:6px 14px; margin:10px auto 0; width:fit-content; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.15); }
    .step { font-size:11px; font-weight:bold; color:var(--white); opacity:0.8; }
    .step.active { color:#a8f0e5; opacity:1; font-size:13px; }
    .step-divider { color:rgba(255,255,255,0.6); font-size:10px; }
    .back-btn-header { position:absolute; top:12px; right:12px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:900; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:5px; backdrop-filter:blur(6px); z-index:10; }
    .cloud-badge { position:absolute; top:12px; left:12px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:20px; font-size:10px; font-weight:900; display:flex; align-items:center; gap:5px; backdrop-filter:blur(6px); z-index:10; }
    .cloud-badge .dot { width:7px; height:7px; border-radius:50%; background:#22C55E; box-shadow:0 0 8px #22C55E; animation:pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .main-container { width:100%; max-width:650px; margin:-15px auto 0; padding:0 10px; position:relative; z-index:10; }
    .progress-track { height:6px; background:rgba(0,0,0,0.08); border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--primary-teal),#38bdf8); border-radius:10px; width:0%; transition:width 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }
    .answers-section { margin-bottom:16px; }
    .answers-label { font-size:12px; color:var(--text-gray); font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px; padding-right:4px; }
    .answers-label svg { width:14px; height:14px; color:var(--primary-teal); }
    .answers-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:8px; }
    .answer-box { position:relative; background:var(--white); border:2px dashed rgba(15,23,41,0.12); border-radius:14px; padding:12px 10px; min-height:72px; display:flex; flex-direction:column; justify-content:center; text-align:center; transition:all 0.4s; }
    .answer-box .box-question { font-size:9px; color:var(--text-gray); font-weight:800; margin-bottom:4px; }
    .answer-box .box-value { font-size:13px; color:var(--text-dark); font-weight:900; line-height:1.3; word-break:break-word; }
    .answer-box.filled { border-style:solid; border-color:var(--box-color,var(--primary-teal)); background:linear-gradient(145deg,#ffffff,#f8fafc); box-shadow:0 4px 15px rgba(15,23,41,0.08); animation:boxPop 0.5s; }
    .answer-box.filled .box-question { color:var(--box-color,var(--primary-teal)); }
    .answer-box.filled::before { content:'✓'; position:absolute; top:6px; left:8px; width:18px; height:18px; border-radius:50%; background:var(--box-color,var(--primary-teal)); color:#fff; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; }
    @keyframes boxPop { 0%{transform:scale(0.85);opacity:0.5;} 50%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
    .question-card { background:var(--white); border:1.5px solid #e2e8f0; border-radius:22px; padding:22px 18px; box-shadow:0 4px 20px rgba(15,23,41,0.06); animation:cardEntry 0.5s; position:relative; overflow:hidden; }
    .question-card::before { content:''; position:absolute; top:0; right:0; left:0; height:4px; background:linear-gradient(90deg,var(--primary-teal),#38bdf8,#a78bfa); }
    @keyframes cardEntry { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    .question-number { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(135deg,rgba(37,150,139,0.1),rgba(2,132,199,0.1)); color:var(--primary-teal); padding:5px 12px; border-radius:20px; font-size:11px; font-weight:900; margin-bottom:14px; border:1px solid rgba(37,150,139,0.2); }
    .question-title { font-size:18px; font-weight:900; color:var(--text-dark); margin-bottom:6px; }
    .question-subtitle { font-size:12px; color:var(--text-gray); font-weight:700; margin-bottom:18px; }
    .options-list { display:flex; flex-direction:column; gap:10px; }
    .option-item { position:relative; background:#f8fafc; border:2px solid rgba(15,23,41,0.06); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all 0.3s; overflow:hidden; user-select:none; }
    .option-item:hover { background:#fff; border-color:var(--opt-color,var(--primary-teal)); transform:translateY(-2px); }
    .option-item.selected { background:linear-gradient(145deg,#fff,#f8fafc); border-color:var(--opt-color,var(--primary-teal)); box-shadow:0 6px 20px rgba(15,23,41,0.1); transform:translateY(-2px); }
    .option-radio { width:24px; height:24px; border-radius:50%; border:2.5px solid rgba(15,23,41,0.15); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff; }
    .option-radio::after { content:''; width:12px; height:12px; border-radius:50%; background:var(--opt-color,var(--primary-teal)); transform:scale(0); transition:transform 0.3s; }
    .option-item.selected .option-radio { border-color:var(--opt-color,var(--primary-teal)); }
    .option-item.selected .option-radio::after { transform:scale(1); }
    .option-content { flex:1; min-width:0; }
    .option-label { font-size:14.5px; font-weight:900; color:var(--text-dark); margin-bottom:2px; }
    .option-desc { font-size:11px; color:var(--text-gray); font-weight:700; }
    .option-icon { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--opt-bg,linear-gradient(135deg,#25968b,#1b736a)); color:#fff; flex-shrink:0; font-size:20px; transition:transform 0.3s; }
    .option-item.selected .option-icon { transform:scale(1.08) rotate(-5deg); }
    .nav-buttons { display:flex; gap:10px; margin-top:20px; }
    .btn { flex:1; padding:15px 20px; border-radius:14px; border:none; font-family:'Cairo',sans-serif; font-size:14px; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.3s; }
    .btn svg { width:18px; height:18px; }
    .btn-prev { background:#fff; color:var(--text-dark); border:1.5px solid #e2e8f0; flex:0 0 auto; }
    .btn-next { background:linear-gradient(135deg,var(--primary-teal),#0284c7); color:#fff; box-shadow:0 6px 20px rgba(37,150,139,0.35); }
    .btn-next:disabled { opacity:0.4; cursor:not-allowed; box-shadow:none; }
    .btn-finish { background:linear-gradient(135deg,#10B981,#047857); color:#fff; }
    .success-screen { display:none; text-align:center; padding:30px 20px; }
    .success-screen.show { display:block; animation:cardEntry 0.6s; }
    .success-icon { width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#10B981,#047857); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; box-shadow:0 10px 30px rgba(16,185,129,0.35); }
    .success-icon svg { width:45px; height:45px; color:#fff; stroke-width:3; }
    .success-title { font-size:22px; font-weight:900; color:var(--text-dark); margin-bottom:8px; }
    .success-desc { font-size:13px; color:var(--text-gray); font-weight:700; margin-bottom:24px; }
    .btn-continue { background:linear-gradient(135deg,#10B981,#047857); color:#fff; border:none; padding:15px 32px; border-radius:14px; font-family:'Cairo',sans-serif; font-size:15px; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; gap:8px; box-shadow:0 6px 20px rgba(16,185,129,0.4); }
    .btn-continue svg { width:20px; height:20px; }
    .ripple { position:absolute; border-radius:50%; transform:scale(0); animation:rippleAnim 0.6s linear; background:rgba(37,150,139,0.15); pointer-events:none; z-index:5; }
    @keyframes rippleAnim { to{transform:scale(4);opacity:0;} }
    @media (max-width:480px) {
        .header-3d h1 { font-size:17px; }
        .answers-grid { grid-template-columns:repeat(auto-fill,minmax(95px,1fr)); gap:6px; }
        .answer-box { padding:10px 8px; min-height:66px; }
        .answer-box .box-value { font-size:12px; }
        .question-card { padding:18px 14px; }
        .question-title { font-size:16px; }
        .option-item { padding:12px 13px; gap:10px; }
        .option-icon { width:38px; height:38px; font-size:18px; }
    }
    @media (max-width:360px) { .answers-grid { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>

<header class="header-3d">
    <a href="mester3.html" class="back-btn-header"><span>🏠</span><span>الرئيسية</span></a>
    <div class="cloud-badge"><span class="dot"></span><span>متصل ☁️</span></div>
    <h1>منصة احجزلي</h1>
    <p class="subtitle">بوابة المعلم - إعداد التخصص</p>
    <div class="stepper">
        <div class="step active">1. التخصص</div>
        <div class="step-divider">❯</div>
        <div class="step">2. المواعيد والمجموعات</div>
    </div>
</header>

<div class="main-container">
    <div class="progress-track"><div class="progress-fill" id="globalProgressFill"></div></div>

    <div class="answers-section">
        <div class="answers-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            <span>ملخص اختياراتك</span>
        </div>
        <div class="answers-grid" id="answersGrid"></div>
    </div>

    <div id="questionContainer"><div class="question-card" id="questionCard"></div></div>

    <div class="success-screen" id="successScreen">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <div class="success-title">تم إعداد تخصصك بنجاح! 🎉</div>
        <div class="success-desc">هيا بنا الآن لإعداد مجموعتك ومواعيدك</div>
        <button class="btn-continue" onclick="goToMester2()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
            المتابعة لإعداد المواعيد
        </button>
    </div>
</div>

<script>
let audioCtx = null;
function getCtx() { if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); return audioCtx; }
function playClick(freq=1800,duration=0.035,volume=0.08){ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime; const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(freq,now); osc.frequency.exponentialRampToValueAtTime(freq*1.5,now+duration); const gain=ctx.createGain(); gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(volume,now+0.004); gain.gain.exponentialRampToValueAtTime(0.0001,now+duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now+duration+0.02); }
function playNextSound(){ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime; [700,900,1200].forEach((freq,i)=>{ const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(freq,now+i*0.04); const gain=ctx.createGain(); gain.gain.setValueAtTime(0,now+i*0.04); gain.gain.linearRampToValueAtTime(0.06,now+i*0.04+0.01); gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.04+0.09); osc.connect(gain); gain.connect(ctx.destination); osc.start(now+i*0.04); osc.stop(now+i*0.04+0.1); }); }
function playSuccessSound(){ const ctx=getCtx(); if(!ctx) return; const now=ctx.currentTime; [523,659,784,1047].forEach((freq,i)=>{ const osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(freq,now+i*0.12); const gain=ctx.createGain(); gain.gain.setValueAtTime(0,now+i*0.12); gain.gain.linearRampToValueAtTime(0.09,now+i*0.12+0.02); gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.25); osc.connect(gain); gain.connect(ctx.destination); osc.start(now+i*0.12); osc.stop(now+i*0.12+0.26); }); }
function createRipple(e,element){ const ripple=document.createElement('span'); const rect=element.getBoundingClientRect(); const size=Math.max(rect.width,rect.height); const clientX=e.clientX||(e.touches?.[0]?.clientX??rect.left+rect.width/2); const clientY=e.clientY||(e.touches?.[0]?.clientY??rect.top+rect.height/2); ripple.style.width=ripple.style.height=size+'px'; ripple.style.left=(clientX-rect.left-size/2)+'px'; ripple.style.top=(clientY-rect.top-size/2)+'px'; ripple.classList.add('ripple'); element.appendChild(ripple); setTimeout(()=>ripple.remove(),600); }

const CURRICULUM = {
    kg: { name:'KG', icon:'🧸', color:'#d81b60', grades:[
        { name:'KG1', subjects:['عربي','إنجليزي','ماث','دين'] },
        { name:'KG2', subjects:['عربي','إنجليزي','ماث','دين'] }
    ]},
    primary: { name:'الابتدائي', icon:'📚', color:'#2e7d32', grades:[
        { name:'الأول الابتدائي', subjects:['عربي','إنجليزي','ماث','دين'] },
        { name:'الثاني الابتدائي', subjects:['عربي','إنجليزي','ماث','دين'] },
        { name:'الثالث الابتدائي', subjects:['عربي','إنجليزي','ماث','علوم','دين'] },
        { name:'الرابع الابتدائي', subjects:['عربي','إنجليزي','ماث','علوم','دراسات','دين'] },
        { name:'الخامس الابتدائي', subjects:['عربي','إنجليزي','ماث','علوم','دراسات','دين'] },
        { name:'السادس الابتدائي', subjects:['عربي','إنجليزي','ماث','علوم','دراسات','دين'] }
    ]},
    prep: { name:'الإعدادي', icon:'✏️', color:'#1565c0', grades:[
        { name:'الأول الإعدادي', subjects:['عربي','إنجليزي','ماث','علوم','دراسات','دين'] },
        { name:'الثاني الإعدادي', subjects:['عربي','إنجليزي','ماث','علوم','دراسات','دين'] },
        { name:'الثالث الإعدادي', subjects:['عربي','إنجليزي','ماث','علوم','دراسات','دين'] }
    ]},
    secondary: { name:'الثانوية', icon:'🎓', color:'#e65100', grades:[
        { name:'الأول الثانوي', subjects:['عربي','إنجليزي','ماث','فيزياء','كيمياء','أحياء','دين'] },
        { name:'الثاني الثانوي', subjects:['عربي','إنجليزي','ماث','فيزياء','كيمياء','أحياء','دين'] },
        { name:'الثالث الثانوي', subjects:['عربي','إنجليزي','ماث','فيزياء','كيمياء','أحياء','دين'] }
    ]}
};

const QUESTIONS = [
    { id:'stage', title:'ما هو الصف الدراسي؟', subtitle:'اختر المرحلة الدراسية التي تريد إعداد التخصص لها', type:'stage' },
    { id:'grade', title:'اختر الصف بالتحديد', subtitle:'اختر الصف الدراسي داخل المرحلة المختارة', type:'grade' },
    { id:'subjects', title:'اختر المواد التي تدرسها', subtitle:'يمكنك اختيار أكثر من مادة', type:'subjects' }
];

let currentIndex = 0;
let answers = { stage:'', stageName:'', stageIcon:'', stageColor:'', grade:'', subjects:[] };

function hexToRgba(hex,alpha=1){ if(!hex) return `rgba(37,150,139,${alpha})`; const h=hex.replace('#',''); return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${alpha})`; }
function shadeColor(color,percent){ const num=parseInt(color.replace('#',''),16); const amt=Math.round(2.55*percent); const R=Math.max(0,Math.min(255,(num>>16)+amt)); const G=Math.max(0,Math.min(255,((num>>8)&0x00FF)+amt)); const B=Math.max(0,Math.min(255,(num&0x0000FF)+amt)); return '#'+(0x1000000+R*0x10000+G*0x100+B).toString(16).slice(1); }

function renderAnswerBoxes() {
    const grid = document.getElementById('answersGrid');
    grid.innerHTML = '';
    const boxes = [
        { id:'stage', label:'المرحلة', value:answers.stageName, color:answers.stageColor },
        { id:'grade', label:'الصف', value:answers.grade, color:answers.stageColor },
        { id:'subjects', label:'المواد', value:answers.subjects.length>0?answers.subjects.join(' - '):'', color:answers.stageColor }
    ];
    boxes.forEach(box => {
        const el = document.createElement('div');
        el.className = 'answer-box';
        if(box.value){ el.classList.add('filled'); el.style.setProperty('--box-color', box.color||'#25968b'); }
        el.innerHTML = `<div class="box-question">${box.label}</div><div class="box-value">${box.value||'—'}</div>`;
        grid.appendChild(el);
    });
}

function renderQuestion() {
    const card = document.getElementById('questionCard');
    const q = QUESTIONS[currentIndex];
    document.getElementById('globalProgressFill').style.width = (((currentIndex+1)/QUESTIONS.length)*100)+'%';

    let optionsHTML = '', currentAnswer = '';

    if(q.type === 'stage'){
        currentAnswer = answers.stage;
        optionsHTML = Object.entries(CURRICULUM).map(([id,stage]) => {
            const isSelected = answers.stage === id;
            return `<div class="option-item ${isSelected?'selected':''}" data-value="${id}" style="--opt-color:${stage.color};--opt-bg:linear-gradient(135deg,${stage.color},${shadeColor(stage.color,-20)});">
                <div class="option-radio"></div>
                <div class="option-content"><div class="option-label">${stage.name}</div><div class="option-desc">${stage.grades.length} صفوف دراسية</div></div>
                <div class="option-icon">${stage.icon}</div>
            </div>`;
        }).join('');
    } else if(q.type === 'grade'){
        const stage = CURRICULUM[answers.stage];
        if(!stage){ card.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8">⚠️ اختر المرحلة أولاً</div>'; return; }
        currentAnswer = answers.grade;
        optionsHTML = stage.grades.map(g => {
            const isSelected = answers.grade === g.name;
            return `<div class="option-item ${isSelected?'selected':''}" data-value="${g.name}" style="--opt-color:${stage.color};--opt-bg:linear-gradient(135deg,${stage.color},${shadeColor(stage.color,-20)});">
                <div class="option-radio"></div>
                <div class="option-content"><div class="option-label">${g.name}</div><div class="option-desc">${g.subjects.length} مواد متاحة</div></div>
                <div class="option-icon">${stage.icon}</div>
            </div>`;
        }).join('');
    } else if(q.type === 'subjects'){
        const stage = CURRICULUM[answers.stage];
        const gradeData = stage?.grades.find(g => g.name === answers.grade);
        if(!gradeData){ card.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8">⚠️ اختر الصف أولاً</div>'; return; }
        optionsHTML = gradeData.subjects.map(subject => {
            const isSelected = answers.subjects.includes(subject);
            return `<div class="option-item ${isSelected?'selected':''}" data-value="${subject}" style="--opt-color:${stage.color};--opt-bg:linear-gradient(135deg,${stage.color},${shadeColor(stage.color,-20)});">
                <div class="option-radio"></div>
                <div class="option-content"><div class="option-label">${subject}</div></div>
                <div class="option-icon" style="font-size:16px;font-weight:900;">✓</div>
            </div>`;
        }).join('');
    }

    const isLast = currentIndex === QUESTIONS.length - 1;
    const hasAnswer = q.type === 'subjects' ? answers.subjects.length > 0 : !!currentAnswer;

    card.innerHTML = `
        <div class="question-number">السؤال ${currentIndex+1} من ${QUESTIONS.length}</div>
        <div class="question-title">${q.title}</div>
        <div class="question-subtitle">${q.subtitle}</div>
        <div class="options-list">${optionsHTML}</div>
        <div class="nav-buttons">
            ${currentIndex > 0 ? `<button class="btn btn-prev" onclick="prevQuestion()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> السابق</button>` : ''}
            <button class="btn ${isLast?'btn-finish':'btn-next'}" id="nextBtn" ${!hasAnswer?'disabled':''} onclick="${isLast?'finishQuiz()':'nextQuestion()'}">
                ${isLast?'إنهاء الإعداد':'التالي'}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
        </div>
    `;

    document.querySelectorAll('.option-item').forEach(item => {
        item.addEventListener('click', (e) => selectOption(item, q, e));
        item.addEventListener('touchstart', (e) => createRipple(e, item), { passive:true });
    });
}

function selectOption(item, question, e) {
    createRipple(e, item);
    playClick(question.type === 'subjects' ? 2000 : 1700, 0.04, 0.09);
    if(navigator.vibrate) navigator.vibrate(20);
    const value = item.dataset.value;

    if(question.type === 'stage'){
        const stage = CURRICULUM[value];
        if(answers.stage !== value){
            answers.stage = value;
            answers.stageName = stage.name;
            answers.stageIcon = stage.icon;
            answers.stageColor = stage.color;
            answers.grade = '';
            answers.subjects = [];
        }
    } else if(question.type === 'grade'){
        if(answers.grade !== value){ answers.grade = value; answers.subjects = []; }
    } else if(question.type === 'subjects'){
        if(answers.subjects.includes(value)){
            answers.subjects = answers.subjects.filter(s => s !== value);
            item.classList.remove('selected');
        } else {
            answers.subjects.push(value);
            item.classList.add('selected');
        }
    }

    if(question.type !== 'subjects'){
        document.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
    }

    renderAnswerBoxes();
    updateNextButton();
}

function updateNextButton() {
    const nextBtn = document.getElementById('nextBtn');
    if(!nextBtn) return;
    const q = QUESTIONS[currentIndex];
    const hasAnswer = q.type === 'subjects' ? answers.subjects.length > 0 : (q.type === 'stage' ? !!answers.stage : !!answers.grade);
    nextBtn.disabled = !hasAnswer;
}

function nextQuestion() {
    playNextSound();
    if(navigator.vibrate) navigator.vibrate(25);
    if(currentIndex < QUESTIONS.length - 1){
        currentIndex++;
        renderQuestion();
        renderAnswerBoxes();
        window.scrollTo({top:0,behavior:'smooth'});
    }
}

function prevQuestion() {
    playClick(1500, 0.04, 0.09);
    if(navigator.vibrate) navigator.vibrate(15);
    if(currentIndex > 0){
        currentIndex--;
        renderQuestion();
        renderAnswerBoxes();
        window.scrollTo({top:0,behavior:'smooth'});
    }
}

function finishQuiz() {
    playSuccessSound();
    if(navigator.vibrate) navigator.vibrate([30,50,30]);

    const finalData = {};
    if(answers.subjects.length > 0){
        finalData[answers.stage] = { grade: answers.grade, subjects: [...answers.subjects] };
    }
    localStorage.setItem('teacherSelections', JSON.stringify(finalData));
    localStorage.setItem('mester1_selections', JSON.stringify(finalData));
    localStorage.setItem('mester1_is_locked', 'true');
    localStorage.setItem('mester1_last_saved', String(Date.now()));

    document.getElementById('questionContainer').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');
    document.getElementById('globalProgressFill').style.width = '100%';
}

function goToMester2() {
    playNextSound();
    if(navigator.vibrate) navigator.vibrate(30);
    document.body.style.transition = 'opacity 0.4s';
    document.body.style.opacity = '0.5';
    setTimeout(() => { window.location.href = 'mester2.html'; }, 400);
}

renderAnswerBoxes();
renderQuestion();
document.addEventListener('touchstart', () => getCtx(), { once:true, passive:true });
document.addEventListener('click', () => getCtx(), { once:true, passive:true });
</script>

</body>
</html>
