<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>⚡ المساعد البرمجي الفائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #e0e7ff;
    --accent: #8b5cf6;
    --bg: #0a0a0f;
    --bg-light: #13131f;
    --bg-card: #1a1a2e;
    --border: #2a2a40;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --code-bg: #0d1117;
    --code-border: #30363d;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; font-weight: 700; -webkit-tap-highlight-color: transparent; }

body {
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-image:
        radial-gradient(circle at 20% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
}

/* ============ Header ============ */
.code-header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
    border-bottom: 2px solid var(--border);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 100;
    flex-shrink: 0;
    position: relative;
}
.code-header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
    background-size: 200% 100%;
    animation: headerShine 3s linear infinite;
}
@keyframes headerShine {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
}

.code-header .avatar {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
    flex-shrink: 0;
    position: relative;
    border: 2px solid rgba(255,255,255,0.1);
}
.code-header .avatar::after {
    content: '';
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    background: #22C55E;
    border-radius: 50%;
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 8px #22C55E;
    animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }

.code-header .info { flex: 1; min-width: 0; }
.code-header .info h2 {
    font-size: 16px;
    font-weight: 900;
    background: linear-gradient(90deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.code-header .info p {
    font-size: 11.5px;
    color: var(--text-dim);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
}

.header-actions { display: flex; gap: 6px; flex-shrink: 0; }

.action-btn {
    background: rgba(99, 102, 241, 0.15);
    border: 1.5px solid rgba(99, 102, 241, 0.35);
    color: #a5b4fc;
    padding: 8px 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.25s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
}
.action-btn:hover {
    background: rgba(99, 102, 241, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}
.action-btn.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.35);
    color: #fca5a5;
}
.action-btn.danger:hover {
    background: rgba(239, 68, 68, 0.3);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
}
.action-btn.key-missing {
    background: rgba(239, 68, 68, 0.2);
    border-color: #ef4444;
    color: #fca5a5;
    animation: keyAlert 1.5s infinite;
}
@keyframes keyAlert {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
    50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
}

/* ============ Main Layout ============ */
.main-layout {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* ============ Quick Actions Bar ============ */
.quick-bar {
    background: rgba(26, 26, 46, 0.6);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: thin;
}
.quick-bar::-webkit-scrollbar { height: 4px; }
.quick-bar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

.quick-chip {
    background: rgba(99, 102, 241, 0.1);
    border: 1.5px solid rgba(99, 102, 241, 0.3);
    color: #a5b4fc;
    padding: 7px 14px;
    border-radius: 18px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
    -webkit-tap-highlight-color: transparent;
}
.quick-chip:hover {
    background: rgba(99, 102, 241, 0.25);
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}
.quick-chip:active { transform: translateY(0) scale(0.96); }

/* ============ Chat Area ============ */
.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px 20px;
    scroll-behavior: smooth;
    min-width: 0;
    background: var(--bg);
}
.chat-area::-webkit-scrollbar { width: 8px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb {
    background: rgba(99, 102, 241, 0.3);
    border-radius: 10px;
}
.chat-area::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

/* ============ Messages ============ */
.msg {
    max-width: 92%;
    margin-bottom: 14px;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    position: relative;
    word-wrap: break-word;
    animation: msgIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
@keyframes msgIn {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.msg.user {
    background: linear-gradient(135deg, #1e3a5f, #1e40af);
    color: #e0f2fe;
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-bottom-left-radius: 4px;
    margin-right: auto;
    margin-left: 0;
}
.msg.ai {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
    margin-left: auto;
    margin-right: 0;
}
.msg.ai::before {
    content: '⚡ CODE AI';
    position: absolute;
    top: -10px;
    right: 10px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    font-size: 9px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.5);
    letter-spacing: 0.5px;
}
.msg.user::before {
    content: '👤 أنت';
    position: absolute;
    top: -10px;
    right: 10px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    font-size: 9px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 8px;
}

.msg .time {
    font-size: 10px;
    color: var(--text-dim);
    text-align: left;
    margin-top: 8px;
    font-weight: 800;
    opacity: 0.7;
}
.msg.user .time { text-align: right; }

/* ============ Code Blocks ============ */
.msg.ai b, .msg.ai strong { color: #a5b4fc; font-weight: 900; }
.msg.ai code {
    background: var(--code-bg);
    padding: 3px 8px;
    border-radius: 5px;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 13px;
    color: #f472b6;
    direction: ltr;
    display: inline-block;
    border: 1px solid var(--code-border);
}

.msg pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 10px;
    margin: 12px 0;
    position: relative;
    overflow: hidden;
}
.msg pre::before {
    content: attr(data-lang);
    position: absolute;
    top: 0;
    left: 0;
    background: rgba(99, 102, 241, 0.2);
    color: #a5b4fc;
    font-size: 10px;
    font-weight: 900;
    padding: 3px 10px;
    border-bottom-right-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.msg pre code {
    display: block;
    background: transparent;
    padding: 32px 16px 16px;
    color: #e6edf3;
    font-size: 12.5px;
    line-height: 1.7;
    overflow-x: auto;
    border: none;
    direction: ltr;
    text-align: left;
    white-space: pre;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
}
.msg pre code::-webkit-scrollbar { height: 6px; }
.msg pre code::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 10px; }

.copy-code-btn {
    position: absolute;
    top: 6px;
    right: 8px;
    background: rgba(99, 102, 241, 0.85);
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    transition: all 0.2s;
    z-index: 5;
}
.copy-code-btn:hover {
    background: var(--primary);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(99, 102, 241, 0.5);
}
.copy-code-btn.copied {
    background: var(--success);
}

.msg.ai ul, .msg.ai ol {
    margin: 10px 0;
    padding-right: 22px;
}
.msg.ai li { margin-bottom: 6px; }
.msg.ai hr {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 12px 0;
}
.msg.ai h1, .msg.ai h2, .msg.ai h3 {
    color: #a5b4fc;
    margin: 12px 0 8px;
    font-size: 15px;
}

/* ============ Suggestions ============ */
.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    animation: msgIn 0.3s ease;
}
.suggestion-chip {
    background: var(--bg-card);
    border: 1.5px solid rgba(99, 102, 241, 0.4);
    color: #a5b4fc;
    padding: 10px 16px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-align: right;
    direction: rtl;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.suggestion-chip:hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: var(--primary);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
}
.suggestion-chip:active { transform: translateY(0) scale(0.96); }

/* ============ Input Area ============ */
.input-area {
    background: var(--bg-light);
    border-top: 1px solid var(--border);
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
}
.input-area .input-wrap {
    flex: 1;
    background: var(--bg-card);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: flex-end;
    border: 1.5px solid var(--border);
    transition: all 0.2s;
}
.input-area .input-wrap:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
}
.input-area textarea {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    font-weight: 800;
    color: var(--text);
    background: transparent;
    padding: 4px 0;
    resize: none;
    max-height: 140px;
    line-height: 1.5;
    -webkit-appearance: none;
}
.input-area textarea::placeholder { color: #64748b; }

.send-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
    transition: all 0.2s;
}
.send-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.7);
}
.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============ Typing ============ */
.typing {
    display: inline-flex;
    gap: 5px;
    padding: 14px 18px;
    background: var(--bg-card);
    border-radius: 16px;
    border-bottom-right-radius: 4px;
    margin-left: auto;
    margin-bottom: 14px;
    width: fit-content;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.typing span {
    width: 9px;
    height: 9px;
    background: var(--primary);
    border-radius: 50%;
    animation: typing 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; background: var(--accent); }
.typing span:nth-child(3) { animation-delay: 0.4s; background: #06b6d4; }
@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
}

/* ============ Toast ============ */
.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--danger);
    color: #fff;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 900;
    opacity: 0;
    transition: all 0.3s;
    z-index: 9998;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.info { background: var(--primary); }

/* ============ Welcome Card ============ */
.welcome-card {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.1));
    border: 1.5px solid rgba(99, 102, 241, 0.4);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
    animation: msgIn 0.3s ease;
    position: relative;
    overflow: hidden;
}
.welcome-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
    pointer-events: none;
}
.welcome-card h3 {
    color: #a5b4fc;
    font-size: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
}
.welcome-card p {
    font-size: 13px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 12px;
    position: relative;
}
.welcome-card .features {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 12px;
    position: relative;
}
.welcome-card .feature-item {
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 10px;
    padding: 10px;
    font-size: 12px;
    color: var(--text);
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 7px;
}

/* ============ Key Modal ============ */
.key-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeInKey 0.2s ease;
}
.key-modal-overlay.show { display: flex; }

@keyframes fadeInKey {
    from { opacity: 0; }
    to { opacity: 1; }
}

.key-modal-box {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 26px 22px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(99, 102, 241, 0.1);
    animation: slideUpKey 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    direction: rtl;
    text-align: right;
    position: relative;
    overflow: hidden;
}
.key-modal-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
    background-size: 200% 100%;
    animation: headerShine 3s linear infinite;
}

@keyframes slideUpKey {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.key-modal-box h3 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 900;
    color: #a5b4fc;
    display: flex;
    align-items: center;
    gap: 8px;
}

.key-modal-box p {
    margin: 0 0 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.6;
}

.key-modal-box input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    font-family: 'Consolas', monospace;
    font-weight: 800;
    font-size: 13px;
    outline: none;
    box-sizing: border-box;
    background: var(--bg-light);
    color: var(--text);
    letter-spacing: 0.5px;
    transition: all 0.2s;
    direction: ltr;
}

.key-modal-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    background: var(--bg);
}

.key-modal-status {
    font-size: 12px;
    font-weight: 900;
    margin-top: 10px;
    min-height: 18px;
    text-align: center;
}
.key-modal-status.ok { color: var(--success); }
.key-modal-status.err { color: var(--danger); }
.key-modal-status.loading { color: var(--warning); }

.key-modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.key-modal-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
}
.key-modal-buttons button:active { transform: scale(0.97); }

.key-btn-cancel {
    background: var(--bg-light);
    color: var(--text);
    border: 1px solid var(--border) !important;
}
.key-btn-cancel:hover { background: #232338; }

.key-btn-save {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.5);
}
.key-btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(99, 102, 241, 0.7); }

.key-modal-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    font-weight: 900;
    color: #a5b4fc;
    text-decoration: none;
}
.key-modal-link:hover { text-decoration: underline; }

/* ============ Mobile ============ */
@media (max-width: 768px) {
    .header-actions { gap: 4px; }
    .action-btn { padding: 7px 10px; font-size: 11px; }
    .quick-chip { font-size: 11px; padding: 6px 12px; }
    .msg { font-size: 13.5px; padding: 12px 14px; }
    .msg pre code { font-size: 11.5px; padding: 30px 12px 12px; }
    .welcome-card .features { grid-template-columns: 1fr; }
    .chat-area { padding: 12px 8px 16px; }
    .input-area { padding: 10px 8px; }
}
</style>
</head>
<body>

<div class="code-header">
    <div class="avatar">⚡</div>
    <div class="info">
        <h2>المساعد البرمجي الفائق</h2>
        <p><span id="statusText">جاهز لمراجعة وتطوير الأكواد — ذكاء فائق</span></p>
    </div>
    <div class="header-actions">

<script>
/* ============================================================ */
/* ============ 🔑 Groq Configuration ============ */

const FALLBACK_KEY = '';
let GROQ_API_KEY = localStorage.getItem('groq_api_key_code') || FALLBACK_KEY;

const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';

const GROQ_MODELS = [
    'openai/gpt-oss-120b',

/* ============ حالة التطبيق ============ */
const appState = {

/* ============ DOM ============ */
const chatArea = document.getElementById('chatArea');

const toastEl = document.getElementById('toast');

/* ============ System Prompt الفائق ============ */
const SYSTEM_PROMPT = `أنت **مهندس برمجيات فائق الذكاء** بخبرة 20 سنة في جميع لغات البرمجة والتقنيات.

🎯 **مهمتك الأساسية:**
أنت متخصص في:
1. **كتابة أكواد كاملة** بدون أي خطأ أو نقصان — من أول سطر لآخر سطر
2. **مراجعة وتصحيح الأكواد** المرفقة مع شرح كل خطأ

4. **شرح الأكواد** خطوة بخطوة بالعربي الواضح
5. **إعادة كتابة الأكواد** بأحدث المعايير (ES6+, Best Practices)

⚙️ **قواعد صارمة لا يمكن تجاوزها:**

**عند طلب كتابة كود:**
- اكتب الكود **كاملاً 100%** من أول سطر لآخر سطر — بدون "..." أو "// باقي الكود"
- تأكد إن الكود **يشتغل فوراً** بدون تعديل
- اكتب الكود جوه \`\`\`language ... \`\`\` (حدد اللغة صح)
- ضيف تعليقات توضيحية قصيرة بالعربي في الأماكن المهمة
- اتبع Best Practices للغة المستخدمة
- لو الكود طويل، قسمه لأجزاء واضحة بأسماء ملفات

**عند التحسين:**

**التنسيق:**
- استخدم \`\`\`language للكود
- استخدم **bold** للعناوين
- استخدم - للنقاط
- استخدم 1. 2. 3. للخطوات المرقمة

**القواعد الذهبية:**
✅ لا تختصر أبداً — الكود الكامل دائماً
✅ لا تفترض — لو محتاج توضيح، اسأل
✅ لا تخترع مكتبات — استخدم المعروف فقط
✅ اختبر ذهنياً كل سطر قبل كتابته
✅ اتكلم بالعربي الواضح والمهني

**لغات وتقنيات أنت خبير فيها:**
HTML5, CSS3, JavaScript (ES6+), TypeScript, React, Vue, Angular, Node.js, Express, MongoDB, MySQL, PostgreSQL, Firebase, Python, PHP, Laravel, Java, C++, C#, Dart, Flutter, React Native, Swift, Kotlin, Git, Docker, Linux, REST APIs, GraphQL, Tailwind, Bootstrap, jQuery.

**لو السؤال مش برمجي:**
اعتذر بأدب وقل إنك مساعد برمجي فقط.

⚠️ **لا تحاول**: اختراق أنظمة، كسر أمان، كتابة كود ضار.`;

/* ============ أدوات ============ */
function scrollBottom() {
    setTimeout(() => {
        chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
    }, 100);
}

function currentTime() {
    const d = new Date();
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showToast(text, type = 'error') {
    toastEl.textContent = text;
    toastEl.className = 'toast';
    if (type === 'success') toastEl.classList.add('success');
    if (type === 'info') toastEl.classList.add('info');
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

/* ============ تحويل النص لـ HTML آمن مع دعم الأكواد ============ */
function formatMessage(text) {
    // 1. HTML escape
    let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // 2. Code blocks مع حفظ اللغة (قبل أي تحويل تاني)
    const codeBlocks = [];
    html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
        const id = `__CODE_BLOCK_${codeBlocks.length}__`;
        const cleanLang = (lang || 'code').toLowerCase();
        const cleanCode = code.trim();
        codeBlocks.push(
            `<pre data-lang="${cleanLang}"><code>${cleanCode}</code><button class="copy-code-btn" onclick="copyCode(this)">📋 نسخ</button></pre>`
        );
        return id;
    });

    // 3. Inline code
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // 4. Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

    // 5. Headers
    html = html.replace(/^### (.+)$/gm, '<h3>▸ $1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h3>◆ $1</h3>');
    html = html.replace(/^# (.+)$/gm, '<h3>● $1</h3>');

    // 6. Lists
    html = html.replace(/^- (.+)$/gm, '• $1');
    html = html.replace(/^\* (.+)$/gm, '• $1');
    html = html.replace(/^\d+\. (.+)$/gm, (m, p1) => `• ${p1}`);

    // 7. HR
    html = html.replace(/^---$/gm, '<hr>');

    // 8. New lines
    html = html.replace(/\n/g, '<br>');

    // 9. رجّع الـ code blocks
    codeBlocks.forEach((block, i) => {
        html = html.replace(`__CODE_BLOCK_${i}__`, block);
    });

    return html;
}

function _addMessage(who, text, saveToHistory = true) {
    const msg = document.createElement('div');
    msg.className = `msg ${who}`;

    const formatted = formatMessage(text);
    msg.innerHTML = formatted + `<div class="time">${currentTime()}</div>`;
    chatArea.appendChild(msg);
    scrollBottom();

    if (saveToHistory) {
        appState.chatHistory.push({
            role: who === 'ai' ? 'assistant' : 'user',
            content: text,
            time: Date.now()
        });
        if (appState.chatHistory.length > 40) {
            appState.chatHistory = appState.chatHistory.slice(-40);
        }
        localStorage.setItem('code_chat_history', JSON.stringify(appState.chatHistory));
    }
}

function addUserMessage(text) { _addMessage('user', text); }
function addAIMessage(text) { _addMessage('ai', text); }

function showTyping() {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chatArea.appendChild(typing);
    scrollBottom();
    return typing;
}

/* ============ نسخ الكود ============ */
window.copyCode = function(btn) {
    const codeEl = btn.parentElement.querySelector('code');
    if (!codeEl) return;
    const text = codeEl.innerText;
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ تم النسخ';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 نسخ';
            btn.classList.remove('copied');
        }, 1500);
    }).catch(() => {
        showToast('فشل النسخ', 'error');
    });
};

/* ============ السؤال السريع ============ */
window.quickAsk = function(text) {
    chatInput.value = text;
    autoResize(chatInput);
    handleSend();
};

/* ============ إرسال للـ Groq ============ */
async function askGroq(userMessage) {
    if (!GROQ_API_KEY || !GROQ_API_KEY.startsWith('gsk_')) {
        updateKeyButtonState();
        return '❌ **مفيش مفتاح Groq محفوظ**\n\nدوس على زرار 🔑 فوق واكتب المفتاح الجديد.';
    }

    const messages = [
        { role: 'system', content: SYSTEM_PROMPT }
    ];

    // آخر 10 رسائل من التاريخ
    const recentHistory = appState.chatHistory.slice(-10);
    recentHistory.forEach(h => messages.push({ role: h.role, content: h.content }));
    
    // نتأكد إن آخر رسالة مش مكررة
    if (recentHistory.length === 0 || recentHistory[recentHistory.length - 1].content !== userMessage) {
        messages.push({ role: 'user', content: userMessage });
    }

    let response = null;
    let lastError = null;

    const savedModel = localStorage.getItem('groq_working_model_code');
    let modelsToTry = [...GROQ_MODELS];
    if (savedModel && modelsToTry.includes(savedModel)) {
        modelsToTry = [savedModel, ...modelsToTry.filter(m => m !== savedModel)];
    }

    for (const model of modelsToTry) {
        try {
            console.log(`⚡ Trying: ${model}`);
            
            response = await fetch(GROQ_API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${GROQ_API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                    temperature: 0.3,       // أقل إبداع، أدق في البرمجة
                    max_tokens: 8000,        // مساحة كبيرة للكود الطويل
                    top_p: 0.9,
                    frequency_penalty: 0.1,
                    presence_penalty: 0.1
                })
            });

            if (response.ok) {
                localStorage.setItem('groq_working_model_code', model);
                console.log(`✅ Success: ${model}`);
                break;
            } else if (response.status === 401) {
                lastError = '401';
                break;
            } else if (response.status === 429) {
                lastError = '429';
                break;
            } else if (response.status === 404) {
                lastError = '404: model not found';
                continue;
            } else {
                lastError = `HTTP ${response.status}`;
                continue;
            }
        } catch(e) {
            lastError = e.message;
            continue;
        }
    }

    if (!response || !response.ok) {
        updateKeyButtonState();
        if (lastError === '401') {
            return '❌ **المفتاح غلط أو اتلغى**\n\nدوس على زرار 🔑 فوق واكتب مفتاح جديد من console.groq.com/keys';
        }
        if (lastError === '429') {
            return '⏳ **وصلت للحد المجاني**\n\nاستنى شوية وجرب تاني.';
        }
        return `❌ **فشل الاتصال**\n\n${lastError}\n\nتأكد من الشبكة، أو جرب تحدّث الصفحة.`;
    }

    const data = await response.json();
    return data.choices?.[0]?.message?.content || 'معلش، مقدرتش أرد.';
}

/* ============ إرسال ============ */
sendBtn.onclick = handleSend;
chatInput.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
};

async function handleSend() {
    const val = chatInput.value.trim();
    if (!val) return;

    chatInput.disabled = true;
    sendBtn.disabled = true;
    chatInput.value = '';
    chatInput.style.height = 'auto';

    addUserMessage(val);

    const typing = showTyping();
    const reply = await askGroq(val);
    typing.remove();
    addAIMessage(reply);

    chatInput.disabled = false;
    sendBtn.disabled = false;
    chatInput.focus();
}

/* ============ مسح المحادثة ============ */
window.clearChat = function() {
    if (!confirm('هل تريد بدء محادثة جديدة؟ سيتم مسح كل الرسائل.')) return;
    appState.chatHistory = [];
    localStorage.removeItem('code_chat_history');
    chatArea.innerHTML = '';
    showWelcome();
    showToast('تم مسح المحادثة', 'success');
};

/* ============ Welcome + Suggestions ============ */
function showWelcome() {
    const welcome = document.createElement('div');
    welcome.className = 'welcome-card';
    welcome.innerHTML = `
        <h3>⚡ أهلاً في المساعد البرمجي الفائق</h3>
        <p>
            أنا مهندس برمجيات بخبرة 20 سنة، متخصص في كتابة ومراجعة وتطوير الأكواد بدقة فائقة.
            <br>الصق أي كود عندك، واطلب أي تعديل — هيديك نسخة كاملة بدون أخطاء أو نقصان.
        </p>
        <div class="features">
            <div class="feature-item">📝 أكواد كاملة بدون اختصار</div>
            <div class="feature-item">🐛 تصحيح كل الأخطاء</div>
            <div class="feature-item">⚡ تحسين الأداء والأمان</div>

        </div>
    `;
    chatArea.appendChild(welcome);
    scrollBottom();

}

function showSuggestions() {
    const suggestions = [
        { icon: '📄', text: 'اكتب لي صفحة HTML كاملة فيها نموذج تسجيل دخول أنيق' },
        { icon: '⚡', text: 'اقترح تحسينات على كود JavaScript لزيادة السرعة' },
        { icon: '🔍', text: 'راجع هذا الكود واذكر كل الأخطاء (سألصقه)' },
        { icon: '🎨', text: 'صمم لي واجهة CSS حديثة لكارت منتج' },
        { icon: '🚀', text: 'حوّل الكود التالي لـ ES6+ (سألصقه)' },
        { icon: '🔥', text: 'اكتب دالة JavaScript للتعامل مع API بشكل احترافي' }
    ];

    const container = document.createElement('div');
    container.className = 'suggestions';
    container.id = 'suggestionsBox';

    suggestions.forEach(s => {
        const chip = document.createElement('button');
        chip.className = 'suggestion-chip';
        chip.innerHTML = `${s.icon} ${s.text}`;
        chip.onclick = () => {
            if (s.text.includes('سألصقه')) {
                chatInput.value = s.text.replace('سألصقه', '') + '\n\n```\n// الصق كودك هنا\n```';
            } else {
                chatInput.value = s.text;
            }
            autoResize(chatInput);
            container.remove();
            chatInput.focus();
        };
        container.appendChild(chip);
    });

    chatArea.appendChild(container);
    scrollBottom();
}

/* ============================================================ */
/* ============ 🔑 إدارة المفتاح ============ */
/* ============================================================ */

window.openKeyModal = function() {
    const modal = document.getElementById('keyModal');
    const input = document.getElementById('apiKeyInput');
    const status = document.getElementById('keyStatus');

    input.value = GROQ_API_KEY && GROQ_API_KEY.startsWith('gsk_') ? GROQ_API_KEY : '';
    status.textContent = '';
    status.className = 'key-modal-status';

    modal.classList.add('show');
    setTimeout(() => input.focus(), 150);
};

window.closeKeyModal = function() {
    document.getElementById('keyModal').classList.remove('show');
};

window.saveApiKey = async function() {
    const input = document.getElementById('apiKeyInput');
    const status = document.getElementById('keyStatus');
    const newKey = input.value.trim();

    if (!newKey || !newKey.startsWith('gsk_')) {
        status.textContent = '❌ المفتاح لازم يبدأ بـ gsk_';
        status.className = 'key-modal-status err';
        return;
    }

    status.textContent = '⏳ جاري التحقق من المفتاح...';
    status.className = 'key-modal-status loading';

    try {
        const testRes = await fetch(GROQ_API_URL, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${newKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: GROQ_MODELS[0],
                messages: [{ role: 'user', content: 'say ok' }],
                max_tokens: 5
            })
        });

        if (testRes.status === 401) {
            status.textContent = '❌ المفتاح غلط أو ملغي';
            status.className = 'key-modal-status err';
            return;
        }

        if (testRes.status === 429) {
            status.textContent = '⚠️ المفتاح سليم بس وصل للحد المجاني';
            status.className = 'key-modal-status loading';
        } else if (!testRes.ok) {
            status.textContent = `⚠️ المفتاح سليم بس فيه مشكلة (${testRes.status})`;
            status.className = 'key-modal-status loading';
        } else {
            status.textContent = '✅ المفتاح شغال تمام!';
            status.className = 'key-modal-status ok';
        }

        GROQ_API_KEY = newKey;
        localStorage.setItem('groq_api_key_code', newKey);
        localStorage.removeItem('groq_working_model_code');

        updateKeyButtonState();

        setTimeout(() => {
            closeKeyModal();
            showToast('✅ تم حفظ المفتاح بنجاح', 'success');
            addAIMessage('✅ **تم تحديث المفتاح بنجاح**\n\nجاهز أستقبل أي كود أو طلب برمجي! 🚀');
        }, 700);

    } catch (e) {
        console.error(e);
        status.textContent = '❌ فشل الاتصال بالإنترنت';
        status.className = 'key-modal-status err';
    }
};

function updateKeyButtonState() {
    const btn = document.querySelector('.action-btn[title="تغيير مفتاح Groq"]');
    if (!btn) return;

    const ok = GROQ_API_KEY && GROQ_API_KEY.startsWith('gsk_');
    btn.classList.toggle('key-missing', !ok);
    btn.title = ok ? 'تغيير مفتاح Groq ✅' : '⚠️ اضغط لإدخال مفتاح Groq';
}

// إغلاق المودال لو ضغط برة
document.getElementById('keyModal')?.addEventListener('click', (e) => {
    if (e.target.id === 'keyModal') closeKeyModal();
});

// Escape
window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('keyModal')?.classList.contains('show')) {
        closeKeyModal();
    }
});

// Enter في حقل المفتاح
document.getElementById('apiKeyInput')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        saveApiKey();
    }
});

/* ============ استرجاع المحادثة السابقة ============ */
function restoreHistory() {
    if (appState.chatHistory.length > 0) {
        appState.chatHistory.forEach(h => {
            const who = h.role === 'assistant' ? 'ai' : 'user';
            const msg = document.createElement('div');
            msg.className = `msg ${who}`;
            msg.innerHTML = formatMessage(h.content) + `<div class="time">📅 سابقاً</div>`;
            chatArea.appendChild(msg);
        });
        scrollBottom();
    } else {
        showWelcome();
    }
}

/* ============ التهيئة ============ */
function init() {
    restoreHistory();
    updateKeyButtonState();
    autoResize(chatInput);

    // لو مفيش مفتاح، نفتحله المودال أوتوماتيك
    if (!GROQ_API_KEY || !GROQ_API_KEY.startsWith('gsk_')) {
        setTimeout(() => {
            openKeyModal();
        }, 800);
    }
}

init();

</script>
