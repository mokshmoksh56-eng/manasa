<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دخول الطالب - منصة احجزلي</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(180deg, #e8f5ec 0%, #d4ecdc 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(30, 126, 52, 0.15);
        max-width: 440px;
        width: 100%;
        overflow: hidden;
    }

    .login-header {
        /* إضافة طبقة داكنة شفافة (Overlay) فوق الصورة لإبراز النص */
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.75) 100%),
                    url('student.png') center/cover no-repeat;
        padding: 50px 25px 40px;
        text-align: center;
        position: relative;
        border-bottom: 4px solid #f1c40f;
    }

    .login-header::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #f1c40f 0%, #f39c12 100%);
    }

    .login-header h1 {
        font-size: 30px;
        font-weight: 900;
        color: #f1c40f;
        margin-bottom: 8px;
        /* ظل خفيف للنص ليصبح أكثر وضوحاً */
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .login-header p {
        font-size: 15px;
        color: #ffffff;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .login-body { padding: 30px 25px; }

    /* تبويبات تسجيل الدخول وإنشاء الحساب */
    .auth-tabs {
        display: flex;
        background: #f0fdf4;
        border-radius: 12px;
        margin-bottom: 22px;
        padding: 4px;
        border: 1px solid #bbf7d0;
    }

    .auth-tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        font-size: 14px;
        font-weight: 800;
        color: #166534;
        cursor: pointer;
        border-radius: 10px;
        transition: 0.3s;
    }

    .auth-tab.active {
        background: #2ecc71;
        color: white;
        box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 900;
        color: #166534;
        margin-bottom: 8px;
    }

    .form-label .required { color: #dc3545; }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e4e8;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        color: #166534;
        background: #fff;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .form-input:focus {
        border-color: #2ecc71;
        outline: none;
        box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.15);
    }

    .pin-wrapper { position: relative; }

    .pin-input {
        letter-spacing: 12px;
        font-size: 22px;
        text-align: center;
        font-weight: 900;
        padding-left: 50px;
        padding-right: 16px;
    }

    .pin-toggle {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: #f0fdf4;
        border: none;
        border-radius: 8px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .pin-toggle:hover { background: #dcfce7; }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(180deg, #2ecc71 0%, #1e7e34 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 6px 0 #155724, 0 8px 15px rgba(0, 0, 0, 0.15);
        transition: 0.2s;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .submit-btn:active {
        transform: translateY(6px);
        box-shadow: 0 0 0 #155724;
    }

    .error-msg {
        background: #fef2f2;
        border: 2px solid #fecaca;
        color: #991b1b;
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 15px;
        display: none;
        align-items: center;
        gap: 8px;
    }

    .error-msg.show { display: flex; }

    .success-msg {
        background: #f0fdf4;
        border: 2px solid #bbf7d0;
        color: #166534;
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 15px;
        display: none;
        align-items: center;
        gap: 8px;
    }

    .success-msg.show { display: flex; }

    .back-home {
        display: block;
        text-align: center;
        margin: 0 25px 25px;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
    }

    .back-home:hover { color: #2ecc71; }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h1>بوابة الطالب</h1>
        <p>منصة احجزلي - دخول الطلاب</p>
    </div>

    <div class="login-body">
        
        <!-- التبويبات -->
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">تسجيل دخول</div>
            <div class="auth-tab" onclick="switchTab('register')">حساب جديد</div>
        </div>

        <div class="error-msg" id="errorMsg">
            <span>⚠️</span>
            <span id="errorText"></span>
        </div>
        <div class="success-msg" id="successMsg">
            <span>✅</span>
            <span id="successText"></span>
        </div>

        <form onsubmit="handleStudentAuth(event)">
            <div class="form-group">
                <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                <input type="tel" id="studentPhone" class="form-input" 
                       placeholder="01xxxxxxxxx" 
                       pattern="01[0125][0-9]{8}" 
                       maxlength="11" 
                       required 
                       dir="ltr"
                       autocomplete="tel"
                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="form-group">
                <label class="form-label">🔒 الرقم السري (4 أرقام) <span class="required">*</span></label>
                <div class="pin-wrapper">
                    <input type="password" id="studentPin" class="form-input pin-input" 
                           placeholder="••••" 
                           maxlength="4" 
                           pattern="[0-9]{4}"
                           inputmode="numeric"
                           required
                           dir="ltr"
                           autocomplete="new-password"
                           oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <button type="button" class="pin-toggle" onclick="togglePin('studentPin', this)">👁️</button>
                </div>
            </div>

            <!-- هذا الحقل سيظهر فقط في حالة إنشاء الحساب -->
            <div class="form-group" id="confirmPinGroup" style="display: none;">
                <label class="form-label">🔒 تأكيد الرقم السري <span class="required">*</span></label>
                <div class="pin-wrapper">
                    <input type="password" id="studentPinConfirm" class="form-input pin-input" 
                           placeholder="••••" 
                           maxlength="4" 
                           pattern="[0-9]{4}"
                           inputmode="numeric"
                           dir="ltr"
                           autocomplete="new-password"
                           oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <button type="button" class="pin-toggle" onclick="togglePin('studentPinConfirm', this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>🚀</span>
                <span id="submitBtnText">تسجيل الدخول</span>
            </button>
        </form>
    </div>

    <a href="index.html" class="back-home">← العودة للصفحة الرئيسية</a>
</div>

<script>
    let currentMode = 'login'; // 'login' or 'register'

    function switchTab(mode) {
        currentMode = mode;
        hideMessages();
        
        const tabs = document.querySelectorAll('.auth-tab');
        if (mode === 'login') {
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            document.getElementById('confirmPinGroup').style.display = 'none';
            document.getElementById('studentPinConfirm').required = false;
            document.getElementById('submitBtnText').textContent = 'تسجيل الدخول';
        } else {
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
            document.getElementById('confirmPinGroup').style.display = 'block';
            document.getElementById('studentPinConfirm').required = true;
            document.getElementById('submitBtnText').textContent = 'إنشاء حساب جديد';
        }
    }

    function togglePin(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
        document.getElementById('successText').textContent = msg;
        document.getElementById('successMsg').classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
    }

    function hideMessages() {
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function handleStudentAuth(e) {
        e.preventDefault();
        hideMessages();

        const phone = document.getElementById('studentPhone').value.trim();
        const pin = document.getElementById('studentPin').value.trim();
        const students = JSON.parse(localStorage.getItem('students_db') || '{}');

        if (currentMode === 'register') {
            // حالة إنشاء حساب جديد
            const pinConfirm = document.getElementById('studentPinConfirm').value.trim();

            if (pin !== pinConfirm) {
                showError('الرقم السري وتأكيد الرقم السري غير متطابقين.');
                return;
            }

            if (students[phone]) {
                showError('هذا الرقم مسجل لدينا بالفعل! يرجى اختيار تسجيل الدخول.');
                return;
            }

            // تسجيل مستخدم جديد
            students[phone] = { id: phone, phone, pin, role: 'student' };
            localStorage.setItem('students_db', JSON.stringify(students));
            showSuccess('🎉 تم إنشاء حسابك بنجاح! جاري الدخول...');
            
            loginStudent(phone);

        } else {
            // حالة تسجيل الدخول
            if (!students[phone]) {
                showError('لا يوجد حساب مسجل بهذا الرقم. يرجى إنشاء حساب جديد.');
                return;
            }

            if (students[phone].pin !== pin) {
                showError('الرقم السري غير صحيح، يرجى المحاولة مرة أخرى.');
                return;
            }

            showSuccess('✅ تم تسجيل الدخول بنجاح! جاري التوجيه...');
            loginStudent(phone);
        }
    }

    function loginStudent(phone) {
        // تحديث الملف الشخصي الحالي ليعرف النظام من قام بالدخول
        const existingProfile = JSON.parse(localStorage.getItem('current_student_profile') || '{}');
        existingProfile.phone = phone;
        existingProfile.id = phone;
        localStorage.setItem('current_student_profile', JSON.stringify(existingProfile));

        // الانتقال لصفحة الطالب بعد ثانية واحدة (لقراءة رسالة النجاح)
        setTimeout(() => {
            window.location.href = 'talep.html';
        }, 1000);
    }
</script>

</body>
</html>
