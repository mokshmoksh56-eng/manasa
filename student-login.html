<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دخول الطالب - منصة احجزلي</title>

<!-- مكتبات Firebase لقاعدة البيانات -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyABNlQQpyIw3k_ziw_-xT7SUrMV_v8Tt1Y",
        authDomain: "manasa-2e9bd.firebaseapp.com",
        projectId: "manasa-2e9bd",
        storageBucket: "manasa-2e9bd.firebasestorage.app",
        messagingSenderId: "603553286689",
        appId: "1:603553286689:web:dbc6db83d6c1eee1feb160",
        measurementId: "G-VG0KN2RMS0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
</script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { min-height: 100vh; background: linear-gradient(180deg, #e8f5ec 0%, #d4ecdc 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(30, 126, 52, 0.15); max-width: 440px; width: 100%; overflow: hidden; }
    .login-header { background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.75) 100%), url('student.png') center/cover no-repeat; padding: 50px 25px 40px; text-align: center; position: relative; border-bottom: 4px solid #f1c40f; }
    .login-header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #f1c40f 0%, #f39c12 100%); }
    .login-header h1 { font-size: 30px; font-weight: 900; color: #f1c40f; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .login-header p { font-size: 15px; color: #ffffff; font-weight: 700; letter-spacing: 0.5px; }
    .login-body { padding: 30px 25px 20px; }
    .auth-tabs { display: flex; background: #f0fdf4; border-radius: 12px; margin-bottom: 22px; padding: 4px; border: 1px solid #bbf7d0; }
    .auth-tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 800; color: #166534; cursor: pointer; border-radius: 10px; transition: 0.3s; }
    .auth-tab.active { background: #2ecc71; color: white; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 900; color: #166534; margin-bottom: 8px; }
    .form-label .required { color: #dc3545; }
    .form-input { width: 100%; padding: 14px 16px; border: 2px solid #e0e4e8; border-radius: 12px; font-size: 16px; font-weight: 700; color: #166534; background: #fff; transition: all 0.2s ease; font-family: inherit; }
    .form-input:focus { border-color: #2ecc71; outline: none; box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.15); }
    .pin-wrapper { position: relative; }
    .pin-input { letter-spacing: 12px; font-size: 22px; text-align: center; font-weight: 900; padding-left: 50px; padding-right: 16px; }
    .pin-toggle { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: #f0fdf4; border: none; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .pin-toggle:hover { background: #dcfce7; }
    .submit-btn { width: 100%; padding: 16px; background: linear-gradient(180deg, #2ecc71 0%, #1e7e34 100%); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #155724, 0 8px 15px rgba(0, 0, 0, 0.15); transition: 0.2s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .submit-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #155724; }
    .submit-btn.delete-mode { background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 6px 0 #991b1b, 0 8px 15px rgba(0, 0, 0, 0.15); }
    .submit-btn.delete-mode:active { box-shadow: 0 0 0 #991b1b; }
    .error-msg, .success-msg { padding: 12px 15px; border-radius: 10px; font-size: 13px; font-weight: 800; margin-bottom: 15px; display: none; align-items: center; gap: 8px; }
    .error-msg { background: #fef2f2; border: 2px solid #fecaca; color: #991b1b; }
    .success-msg { background: #f0fdf4; border: 2px solid #bbf7d0; color: #166534; }
    .error-msg.show, .success-msg.show { display: flex; }
    .info-box { background: #e0f2fe; border: 2px solid #bae6fd; border-radius: 10px; padding: 12px; margin-top: 15px; font-size: 12px; font-weight: 700; color: #075985; line-height: 1.6; }
    .footer-links { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 0 25px 25px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    .footer-link { color: #64748b; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.2s; }
    .footer-link:hover { color: #2ecc71; }
    .delete-link { color: #ef4444; }
    .delete-link:hover { color: #dc2626; }
    .divider { color: #cbd5e1; }
    .brand-signature { margin-top: 25px; font-size: 14px; font-weight: 800; color: #155724; text-align: center; opacity: 0.9; }
    .brand-signature span { color: #b45309; background: #fef3c7; padding: 3px 10px; border-radius: 8px; margin-right: 5px; border: 1px dashed #f59e0b; display: inline-block; }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h1>بوابة الطالب</h1>
        <p>منصة احجزلي - دخول الطلاب</p>
    </div>

    <div class="login-body">
        <div class="auth-tabs" id="mainTabs">
            <div class="auth-tab active" onclick="switchTab('login')">تسجيل دخول</div>
            <div class="auth-tab" onclick="switchTab('register')">حساب جديد</div>
        </div>

        <div class="error-msg" id="errorMsg">
            <span>⚠️</span>
            <span id="errorText"></span>
        </div>
        <div class="success-msg" id="successMsg">
            <span>✅</span>
            <span id="successText"></span>
        </div>

        <form onsubmit="handleStudentAuth(event)">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label class="form-label">👤 اسم الطالب <span class="required">*</span></label>
                <input type="text" id="studentName" class="form-input" placeholder="اكتب اسم الطالب (مثال: يوسف محمد)">
            </div>
            <div class="form-group">
                <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                <input type="tel" id="studentPhone" class="form-input" placeholder="01xxxxxxxxx" maxlength="11" required dir="ltr" autocomplete="tel" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>
            <div class="form-group" id="pinGroup">
                <label class="form-label">🔒 الرقم السري (4 أرقام) <span class="required">*</span></label>
                <div class="pin-wrapper">
                    <input type="password" id="studentPin" class="form-input pin-input" placeholder="••••" maxlength="4" inputmode="numeric" required dir="ltr" autocomplete="new-password" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <button type="button" class="pin-toggle" onclick="togglePin('studentPin', this)">👁️</button>
                </div>
            </div>
            <div class="form-group" id="confirmPinGroup" style="display: none;">
                <label class="form-label">🔒 تأكيد الرقم السري <span class="required">*</span></label>
                <div class="pin-wrapper">
                    <input type="password" id="studentPinConfirm" class="form-input pin-input" placeholder="••••" maxlength="4" inputmode="numeric" dir="ltr" autocomplete="new-password" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <button type="button" class="pin-toggle" onclick="togglePin('studentPinConfirm', this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>🚀</span>
                <span id="submitBtnText">تسجيل الدخول</span>
            </button>
            
            <div class="info-box" id="multiChildInfo" style="display: none;">
                💡 <strong>لديك أكثر من طفل؟</strong> يمكنك التسجيل لهم بنفس رقم الهاتف، فقط تأكد من وضع <strong>رقم سري مختلف</strong> لكل طالب.
            </div>
        </form>
    </div>

    <div class="footer-links">
        <a href="index.html" class="footer-link">← العودة الرئيسية</a>
        <span class="divider">|</span>
        <a href="javascript:void(0)" class="footer-link delete-link" onclick="switchTab('delete')">🗑️ حذف الحساب</a>
    </div>
</div>

<div class="brand-signature">
    تطوير وبناء <span>احجزلي 🚀</span>
</div>

<script>
    let currentMode = 'login'; 

    function switchTab(mode) {
        currentMode = mode;
        hideMessages();
        const tabs = document.querySelectorAll('.auth-tab');
        const submitBtn = document.getElementById('submitBtn');
        tabs.forEach(t => t.classList.remove('active'));

        if (mode === 'login') {
            tabs[0].classList.add('active');
            document.getElementById('nameGroup').style.display = 'none';
            document.getElementById('studentName').required = false;
            document.getElementById('pinGroup').style.display = 'block';
            document.getElementById('studentPin').required = true;
            document.getElementById('confirmPinGroup').style.display = 'none';
            document.getElementById('studentPinConfirm').required = false;
            document.getElementById('multiChildInfo').style.display = 'none';
            document.getElementById('submitBtnText').textContent = 'تسجيل الدخول';
            submitBtn.classList.remove('delete-mode');
        } else if (mode === 'register') {
            tabs[1].classList.add('active');
            document.getElementById('nameGroup').style.display = 'block';
            document.getElementById('studentName').required = true;
            document.getElementById('pinGroup').style.display = 'block';
            document.getElementById('studentPin').required = true;
            document.getElementById('confirmPinGroup').style.display = 'block';
            document.getElementById('studentPinConfirm').required = true;
            document.getElementById('multiChildInfo').style.display = 'block';
            document.getElementById('submitBtnText').textContent = 'إنشاء حساب جديد';
            submitBtn.classList.remove('delete-mode');
        } else if (mode === 'delete') {
            document.getElementById('nameGroup').style.display = 'none';
            document.getElementById('studentName').required = false;
            document.getElementById('pinGroup').style.display = 'none';
            document.getElementById('studentPin').required = false;
            document.getElementById('confirmPinGroup').style.display = 'none';
            document.getElementById('studentPinConfirm').required = false;
            document.getElementById('multiChildInfo').style.display = 'none';
            document.getElementById('submitBtnText').textContent = 'حذف الحساب نهائياً';
            submitBtn.classList.add('delete-mode');
        }
    }

    function togglePin(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; } 
        else { input.type = 'password'; btn.textContent = '👁️'; }
    }

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
        document.getElementById('successText').textContent = msg;
        document.getElementById('successMsg').classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
    }

    function hideMessages() {
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function handleStudentAuth(e) {
        e.preventDefault();
        hideMessages();

        const phone = document.getElementById('studentPhone').value.trim();
        if (!/^01[0125][0-9]{8}$/.test(phone)) return showError('يرجى إدخال رقم هاتف مصري صحيح.');

        const pin = document.getElementById('studentPin').value.trim();
        const accountKey = phone + '_' + pin;

        if (currentMode === 'delete') {
            db.collection("students").where("phone", "==", phone).get().then(snap => {
                if (snap.empty) { showError('⚠️ لا يوجد حساب بهذا الرقم.'); return; }
                const batch = db.batch();
                snap.forEach(doc => batch.delete(doc.ref));
                batch.commit().then(() => {
                    const existingProfile = JSON.parse(localStorage.getItem('current_student_profile') || '{}');
                    if (existingProfile.phone === phone) localStorage.removeItem('current_student_profile');
                    showSuccess('✅ تم حذف الحسابات المرتبطة بنجاح.');
                    document.getElementById('studentPhone').value = '';
                    setTimeout(() => switchTab('login'), 3000);
                });
            }).catch(err => showError('خطأ في الاتصال.'));
            return;
        }

        if (currentMode === 'register') {
            const name = document.getElementById('studentName').value.trim();
            const pinConfirm = document.getElementById('studentPinConfirm').value.trim();
            if (pin !== pinConfirm) return showError('الرقم السري غير متطابق.');

            db.collection("students").doc(accountKey).get().then(doc => {
                if (doc.exists) return showError('يوجد طالب مسجل بهذا الرقم وهذا الرقم السري بالفعل!');
                const studentData = { id: accountKey, name, phone, pin, role: 'student' };
                db.collection("students").doc(accountKey).set(studentData).then(() => {
                    showSuccess(`🎉 تم إنشاء حساب (${name}) بنجاح!`);
                    loginStudent(accountKey, phone, name);
                });
            }).catch(err => showError('خطأ في الاتصال.'));
        } else if (currentMode === 'login') {
            db.collection("students").doc(accountKey).get().then(doc => {
                if (!doc.exists) {
                    db.collection("students").where("phone", "==", phone).get().then(snap => {
                        if (!snap.empty) showError('الرقم السري غير صحيح لهذا الطالب.');
                        else showError('لا يوجد حساب مسجل بهذا الرقم.');
                    });
                    return;
                }
                const studentData = doc.data();
                showSuccess(`✅ أهلاً بك يا ${studentData.name}!`);
                loginStudent(accountKey, studentData.phone, studentData.name);
            }).catch(err => showError('خطأ في الاتصال.'));
        }
    }

    function loginStudent(accountKey, phone, name) {
        const existingProfile = JSON.parse(localStorage.getItem('current_student_profile') || '{}');
        existingProfile.id = accountKey;
        existingProfile.phone = phone;
        existingProfile.name = name;
        localStorage.setItem('current_student_profile', JSON.stringify(existingProfile));
        setTimeout(() => { window.location.href = 'talep.html'; }, 1200);
    }
</script>

</body>
</html>
