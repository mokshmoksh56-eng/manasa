<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دخول الطالب - منصة احجزلي</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(180deg, #e8f5ec 0%, #d4ecdc 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(30, 126, 52, 0.15);
        max-width: 440px;
        width: 100%;
        overflow: hidden;
    }

    .login-header {
        background: linear-gradient(180deg, rgba(41, 53, 72, 0.95) 0%, rgba(20, 27, 38, 0.98) 100%),
                    url('teacher2.png') center/cover no-repeat;
        padding: 30px 25px 35px;
        text-align: center;
        position: relative;
        border-bottom: 4px solid #f1c40f;
    }

    .login-header::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #f1c40f 0%, #f39c12 100%);
    }

    .login-header h1 {
        font-size: 26px;
        font-weight: 900;
        color: #f1c40f;
        margin-bottom: 5px;
        text-shadow: 0 2px 0 #8a6d00, 0 4px 8px rgba(0,0,0,0.3);
    }

    .login-header p {
        font-size: 13px;
        color: #e0f2e7;
        font-weight: 600;
    }

    .login-body { padding: 30px 25px; }

    .welcome-text {
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        border: 2px dashed #86efac;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 22px;
        font-size: 13px;
        font-weight: 700;
        color: #166534;
        text-align: center;
        line-height: 1.6;
    }

    .welcome-text .icon { font-size: 18px; margin-left: 5px; }

    .form-group { margin-bottom: 18px; }

    .form-label {
        display: block;
        font-size: 13px;
        font-weight: 900;
        color: #166534;
        margin-bottom: 8px;
    }

    .form-label .required { color: #dc3545; }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e4e8;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        color: #166534;
        background: #fff;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .form-input:focus {
        border-color: #2ecc71;
        outline: none;
        box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.15);
    }

    .pin-wrapper {
        position: relative;
    }

    .pin-input {
        letter-spacing: 12px;
        font-size: 22px;
        text-align: center;
        font-weight: 900;
        padding-left: 50px;
        padding-right: 16px;
    }

    .pin-toggle {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: #f0fdf4;
        border: none;
        border-radius: 8px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .pin-toggle:hover { background: #dcfce7; }

    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(180deg, #2ecc71 0%, #1e7e34 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 6px 0 #155724, 0 8px 15px rgba(0, 0, 0, 0.15);
        transition: 0.2s;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .submit-btn:active {
        transform: translateY(6px);
        box-shadow: 0 0 0 #155724;
    }

    .error-msg {
        background: #fef2f2;
        border: 2px solid #fecaca;
        color: #991b1b;
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 15px;
        display: none;
        align-items: center;
        gap: 8px;
    }

    .error-msg.show { display: flex; }

    .success-msg {
        background: #f0fdf4;
        border: 2px solid #bbf7d0;
        color: #166534;
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 15px;
        display: none;
        align-items: center;
        gap: 8px;
    }

    .success-msg.show { display: flex; }

    .back-home {
        display: block;
        text-align: center;
        margin: 0 25px 25px;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
    }

    .back-home:hover { color: #2ecc71; }

    .info-box {
        background: #fffbeb;
        border: 2px solid #fde68a;
        border-radius: 10px;
        padding: 12px 14px;
        margin-top: 16px;
        font-size: 12px;
        font-weight: 700;
        color: #92400e;
        line-height: 1.7;
        display: flex;
        gap: 8px;
        align-items: flex-start;
    }

    .info-box .icon { font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h1>بوابة الطالب</h1>
        <p>منصة احجزلي - دخول الطلاب</p>
    </div>

    <div class="login-body">

        <div class="welcome-text">
            <span class="icon">👋</span>
            أهلاً بك يا بطل! سجّل بياناتك عشان نعرضلك المجموعات اللي تناسبك.
        </div>

        <div class="error-msg" id="errorMsg">
            <span>⚠️</span>
            <span id="errorText"></span>
        </div>
        <div class="success-msg" id="successMsg">
            <span>✅</span>
            <span id="successText"></span>
        </div>

        <form onsubmit="handleStudentLogin(event)">
            <div class="form-group">
                <label class="form-label">📱 رقم التليفون <span class="required">*</span></label>
                <input type="tel" id="studentPhone" class="form-input" 
                       placeholder="01xxxxxxxxx" 
                       pattern="01[0125][0-9]{8}" 
                       maxlength="11" 
                       required 
                       dir="ltr"
                       autocomplete="tel"
                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="form-group">
                <label class="form-label">🔒 الرقم السري (4 أرقام) <span class="required">*</span></label>
                <div class="pin-wrapper">
                    <input type="password" id="studentPin" class="form-input pin-input" 
                           placeholder="••••" 
                           maxlength="4" 
                           pattern="[0-9]{4}"
                           inputmode="numeric"
                           required
                           dir="ltr"
                           autocomplete="new-password"
                           oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <button type="button" class="pin-toggle" onclick="togglePin('studentPin', this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>🚀</span>
                <span>دخول / إنشاء حساب</span>
            </button>
        </form>

        <div class="info-box">
            <span class="icon">💡</span>
            <div>
                <strong>أول مرة تدخل؟</strong> هيتم إنشاء حسابك تلقائياً برقم التليفون والرقم السري.<br>
                <strong>دخلت قبل كده؟</strong> دخل نفس الرقم والرقم السري.
            </div>
        </div>

    </div>

    <a href="index.html" class="back-home">← العودة للصفحة الرئيسية</a>
</div>

<script>
    function togglePin(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
        document.getElementById('successText').textContent = msg;
        document.getElementById('successMsg').classList.add('show');
        document.getElementById('errorMsg').classList.remove('show');
    }

    function hideMessages() {
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');
    }

    function handleStudentLogin(e) {
        e.preventDefault();
        hideMessages();

        const phone = document.getElementById('studentPhone').value.trim();
        const pin = document.getElementById('studentPin').value.trim();

        const students = JSON.parse(localStorage.getItem('students_db') || '{}');

        if (!students[phone]) {
            // مستخدم جديد
            students[phone] = { id: phone, phone, pin, role: 'student' };
            localStorage.setItem('students_db', JSON.stringify(students));
            showSuccess('🎉 تم إنشاء حسابك بنجاح!');
        } else if (students[phone].pin !== pin) {
            showError('الرقم السري غير صحيح لهذا الهاتف.');
            return;
        } else {
            showSuccess('✅ تم تسجيل الدخول بنجاح!');
        }

        const existingProfile = JSON.parse(localStorage.getItem('current_student_profile') || '{}');
        existingProfile.phone = phone;
        existingProfile.id = phone;
        localStorage.setItem('current_student_profile', JSON.stringify(existingProfile));

        setTimeout(() => {
            window.location.href = 'talep.html';
        }, 500);
    }
</script>

</body>
</html>
